<style id="voka-word-size">
/* ===== 제시 단어 글씨 크기 (학습 카드·테스트·복습·힌트 창) ===== */
html{--wz:1}html[data-wz="xs"]{--wz:.7}html[data-wz="s"]{--wz:.85}html[data-wz="l"]{--wz:1.2}
.wcard-ko{font-size:calc(15px*var(--wz))}.wcard-ex-de,.wcard-ex-ko{font-size:calc(13px*var(--wz))}
.wcard-de{font-size:calc(24px*var(--wz));line-height:1.3;letter-spacing:-.01em;max-width:calc(100% - 36px);text-wrap:balance}
.tentry-word{font-size:21px;line-height:1.35;letter-spacing:-.01em;text-wrap:balance}
.hint-head-t{font-size:20px;line-height:1.3;letter-spacing:-.01em;text-wrap:balance}
@media(max-width:860px){.wcard-de{font-size:calc(22px*var(--wz))}.tentry-word{font-size:20px}}
/* 주관식 입력 칸이 좁은 화면에서 줄어들 수 있게 (확인 버튼이 카드 밖으로 밀려나지 않게) */
.tentry-input{min-width:0}
/* 아주 긴 단어는 칸에 맞게 그 단어만 줄인다(14px 아래로는 줄이지 않음).
   --dw: 줄바꿈 없이 붙여 쓴 가장 긴 덩어리의 폭(em) — 스크립트 dwPrep이 넣음
   36px·110px·--dwr(기본 70px): 같은 줄에 놓이는 번호·발음 버튼·배지·다시·닫기 버튼 자리 */
@supports (width:1cqi){
  .wcard,.tentry,.hint-pop{container-type:inline-size}
  .wcard-de{font-size:max(calc(14px*var(--wz)),min(calc(24px*var(--wz)),calc((100cqi - 36px) / var(--dw,.01))))}
  .tentry-word{font-size:max(14px,min(21px,calc((100cqi - var(--dwr,70px)) / var(--dw,.01))))}
  .hint-head-t{font-size:max(14px,min(20px,calc((100cqi - 110px) / var(--dw,.01))))}
  @media(max-width:860px){
    .wcard-de{font-size:max(calc(14px*var(--wz)),min(calc(22px*var(--wz)),calc((100cqi - 36px) / var(--dw,.01))))}
    .tentry-word{font-size:max(14px,min(20px,calc((100cqi - var(--dwr,70px)) / var(--dw,.01))))}
  }
}

</style>

    const list = parseCarryBackup(txt);
    carryRef.current = list;
    const st = { ...stateRef.current, revealed: dropCarryRev(revealed), answers: dropCarryKeys(answers), results: dropCarryKeys(results),
      mastery: dropCarryIdx(mastery), wrongMap: dropCarryIdx(wrongMap), reviewCleared: dropCarryIdx(reviewCleared), accepted: dropCarryKeys(accepted), carry: list.map(carrySlim) };
    clearTimeout(timer.current);
    stateRef.current = st;
    window.__VOKA_NO_FLUSH = true;
    saveKey(STORAGE_KEY, JSON.stringify(toDisk(st)));
    setRevealed(st.revealed);setAnswers(st.answers);setResults(st.results);setMastery(st.mastery);setWrongMap(st.wrongMap);setReviewCleared(st.reviewCleared);setAccepted(st.accepted);
    setLog((prev) => [...prev, { ts: Date.now(), type: 'session', msg: `지난 주차 미해결 단어 ${list.length}개 이월` }].slice(-LOG_MAX));
    return list.length;
  }, [revealed, answers, results, mastery, wrongMap, reviewCleared, accepted]);

  const logTimer = useRef(null);
  useEffect(() => {
    clearTimeout(logTimer.current);
    logTimer.current = setTimeout(() => saveKey(LOG_KEY, JSON.stringify(log)), 500);
    return () => clearTimeout(logTimer.current);
  }, [log]);

  const addLog = useCallback((type, msg, ts) => {
    setLog((prev) => [...prev, { ts: ts || Date.now(), type, msg }].slice(-LOG_MAX));
  }, []);

  const rateWord = useCallback((gIdx, known) => {
    const w = WORDS[gIdx];
    setMastery((prev) => {
      const cur = prev[gIdx] || { streak: 0, learned: false, rated: false };
      let next;
      if (known) {
        const now = Date.now();
        // 같은 자리에서 연달아 두 번 누른 것은 외운 것으로 치지 않는다: 첫 「알아요」에서 4시간이 지나야 두 번째를 센다
        if (!cur.learned && cur.streak === 1 && cur.ts && now - cur.ts < STREAK_GAP_MS) return prev;
        const streak = (cur.learned ? 2 : cur.streak || 0) + 1;
        const learned = streak >= 2;
        next = { streak, learned, rated: true, ts: now };
        if (learned) {   // 복습 일정: 학습됨이 된 날부터 3·7·14·30·60일 뒤(허브의 「오늘 복습」에서 확인할 때마다 다음 단계로)
          next.rv = cur.learned && cur.rv !== undefined ? cur.rv : 0;
          next.due = cur.learned && cur.due ? cur.due : window.VokaSrs ? window.VokaSrs.today() + window.VokaSrs.GAPS[0] : 0;
        }
        if (w) {
          if (learned && !cur.learned) addLog('complete', `학습됨 — ${wl(w)} · 알아요 2회`);else
          if (learned) addLog('complete', `학습됨 유지 — ${wl(w)} · 알아요`);else
          addLog('study', `학습 중 ${streak}/2 — ${wl(w)} · 알아요`);
        }
      } else {
        next = { streak: 0, learned: false, rated: true, ts: Date.now() };
        if (w) addLog('review', cur.learned ? `학습됨 → 학습 필요 — ${wl(w)} · 몰라요` : `학습 필요 — ${wl(w)} · 몰라요`);
      }
      return { ...prev, [gIdx]: next };
    });
  }, [addLog]);

  const sessionLogged = useRef(false);
  useEffect(() => {
    if (!sessionLogged.current) {
      sessionLogged.current = true;
      addLog('start', '학습 시작');
    }
    let hiddenAt = 0;
    const flush = () => {if (window.__VOKA_NO_FLUSH) return;try {clearTimeout(timer.current);saveKey(STORAGE_KEY, JSON.stringify(toDisk(stateRef.current)));} catch (e) {}};   // 탭을 닫거나 숨길 때 즉시 저장 (복원·이월 직후 새로고침 때는 건너뜀)
    const onVis = () => {
      if (document.visibilityState === 'hidden') {hiddenAt = Date.now();flush();return;}
      if (hiddenAt && Date.now() - hiddenAt >= 60000) {
        const mins = Math.round((Date.now() - hiddenAt) / 60000);
        addLog('pause', `학습 멈춤 (자리 비움 ${mins}분)`, hiddenAt);
        addLog('resume', '학습 재개');
      }
      hiddenAt = 0;
    };
    const onUnload = () => {
      flush();
      try {
        const l = JSON.parse(localStorage.getItem(LOG_KEY)) || [];
        l.push({ ts: Date.now(), type: 'stop', msg: '학습 종료' });
        localStorage.setItem(LOG_KEY, JSON.stringify(l));
      } catch {}
      try { if (window.VokaSync) window.VokaSync.flush(); } catch (e) {}
    };
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('pagehide', onUnload);
    return () => {
      document.removeEventListener('visibilitychange', onVis);
      window.removeEventListener('pagehide', onUnload);
    };
  }, [addLog]);

  const prevTab = useRef(tab);
  const prevDay = useRef(day);
  useEffect(() => {
    if (prevTab.current !== tab || prevDay.current !== day) {
      if (tab === 'study') addLog('study', `Day ${day + 1} 학습 시작`);else
      if (tab === 'test') addLog('test', `Day ${day + 1} 테스트 시작 (${mode === 'mc' ? '객관식' : '주관식'}, ${dir === 'dk' ? '독→한' : '한→독'})`);else
      if (tab === 'review') addLog('review', `복습 시작 (대상 ${reviewPool.length}개)`);else
      if (tab === 'rtest') addLog('rtest', `복습 테스트 시작 (대상 ${reviewPool.length}개, ${mode === 'mc' ? '객관식' : '주관식'}, ${dir === 'dk' ? '독→한' : '한→독'})`);
      prevTab.current = tab;
      prevDay.current = day;
    }
  }, [tab, day]);

  const off = dayOffset(day);
  const dayWords = WORDS.slice(off, off + SIZES[day]);
  const revWords = WORDS.slice(0, off);

  const toggleReveal = useCallback((d, i) => {
    setRevealed((p) => ({ ...p, [`${d}-${i}`]: !p[`${d}-${i}`] }));
  }, []);
  const toggleRevealKey = useCallback((key) => {
    setRevealed((p) => ({ ...p, [key]: !p[key] }));
  }, []);
  const toggleAll = useCallback((d, show) => {
    setRevealed((p) => {
      const n = { ...p };
      for (let i = 0; i < SIZES[d]; i++) n[`${d}-${i}`] = show;
      return n;
    });
    if (show) addLog('study', `Day ${d + 1} 전체 단어 확인 (${SIZES[d]}개)`);
  }, [addLog]);

  const answersRef = useRef(answers);
  answersRef.current = answers;
  const wrongRef = useRef(new Set());
  const wordForKey = useCallback((key) => {
    const mt = key.match(/^[mf](?:dk|kd)-(\d+)-(n|r|c)-(\d+)$/);
    if (!mt) return null;
    const d = parseInt(mt[1]),sec = mt[2],idx = parseInt(mt[3]);
    const g = sec === 'n' ? dayOffset(d) + idx : sec === 'c' ? TOTAL + idx : idx;
    return WORDS[g] || null;
  }, []);

  // 테스트에서 틀린 단어는 복습 테스트를 새로 푼다: 그 단어의 지난 복습 테스트 답·판정을 지운다.
  // (복습 테스트를 통과했던 단어라면 지난번 답이 정답 표시와 함께 채워져 나와 다시 풀 수 없게 된다)
  const reviewAgain = useCallback((gs) => {
    setAnswers((p) => dropReviewKeys(p, gs));
    setResults((p) => dropReviewKeys(p, gs));
    setAccepted((p) => dropReviewKeys(p, gs));
  }, []);
  const setAnswer = useCallback((key, val) => setAnswers((p) => ({ ...p, [key]: typeof val === 'function' ? val(p[key]) : val })), []);
  const setResult = useCallback((key, val) => {
    setResults((p) => ({ ...p, [key]: val }));
    const w = wordForKey(key);
    if (!w) return;
    const isFree = key[0] === 'f';
    const av = answersRef.current[key];
    const typed = av && typeof av === 'object' ?
    `${av.b || ''} [${(av.p || []).join('/')}] ${av.c ? av.c === 'A' ? '4격' : av.c === 'D' ? '3격' : '2격' : ''}`.trim() :
    (av || '').toString().trim();
    if (val === false) {
      wrongRef.current.add(key);
      const gW = WORDS.indexOf(w);
      if (gW >= 0) {
        setWrongMap((p) => bumpWrong(p, gW, isFree ? typed : ''));
        setReviewCleared((p) => {if (!p[gW]) return p;const n = { ...p };delete n[gW];return n;});
        reviewAgain([gW]);
      }
      addLog('wrong', `오답 — ${wl(w)} · ${isFree ? `입력: "${typed || '—'}"` : '객관식 오답'}`);
    } else if (val === true && wrongRef.current.has(key)) {
      wrongRef.current.delete(key);
      addLog('fix', `수정 정답 — ${wl(w)} · ${isFree ? `재입력: "${typed || '—'}"` : '객관식 재선택'}`);
    }
  }, [addLog, wordForKey, reviewAgain]);
  const retryOne = useCallback((key) => {
    setAnswers((p) => {const n = { ...p };delete n[key];return n;});
    setResults((p) => {const n = { ...p };delete n[key];return n;});
    setAccepted((p) => {if (!p[key]) return p;const n = { ...p };delete n[key];return n;});
  }, []);
  const acceptOne = useCallback((key) => {
    if (!window.confirm('내 답이 정답과 같은 뜻이라고 확신할 때만 인정해 주세요.\n기록에 "학생 판정"으로 남습니다.')) return;
    const rm = key.match(/^rv[mf](?:dk|kd)-g(\d+)$/);
    let g = -1, w = null;
    if (rm) {g = parseInt(rm[1]);w = WORDS[g] || null;} else {w = wordForKey(key);if (w) g = WORDS.indexOf(w);}
    setResults((p) => ({ ...p, [key]: true }));
    setAccepted((p) => ({ ...p, [key]: true }));
    wrongRef.current.delete(key);
    const av = answersRef.current[key];
    const typed = av && typeof av === 'object' ?
    `${av.b || ''} [${(av.p || []).join('/')}] ${av.c ? av.c === 'A' ? '4격' : av.c === 'D' ? '3격' : '2격' : ''}`.trim() :
    (av || '').toString().trim();
    if (!w) return;
    if (rm) {reviewPass(g, `학생 판정 정답 인정 · 입력: "${typed || '—'}"`);return;}
    if (g >= 0) setWrongMap((p) => {if (p[g] === undefined) return p;const n = { ...p };delete n[g];return n;});
    addLog('fix', `정답 인정 (학생 판정) — ${wl(w)} · 입력: "${typed || '—'}"`);
  }, [addLog, wordForKey, reviewPass]);

  const checkAllFree = useCallback(() => {
    const kp = `f${dir}-${day}`;
    let checked = 0,correct = 0;
    const wrongs = [],marks = {};
    // 채점은 여기서 바로 한다. 상태 갱신 함수(setResults 에 넘기는 함수) 안에서 채점하면 React 가 그 함수를 나중에 실행해서,
    // 바로 아래의 오답 기록·복습 대상 넣기·「전체 확인」 기록이 빈 목록으로 지나가 버린다.
    const handle = (w, k) => {
      if (results[k] !== undefined) return;
      const a = answers[k];
      const isPrep = dir === 'kd' && window.parsePrep && window.parsePrep(w.de);
      if (isPrep) {
        if (!a || !(a.b || a.p && a.p.length || a.c)) return;
        const ok = window.gradePrep(a, w.de);
        const cl = a.c ? a.c === 'A' ? '4격' : a.c === 'D' ? '3격' : '2격' : '';
        const typed = `${a.b || ''} [${(a.p || []).join('/')}] ${cl}`.trim();
        marks[k] = ok;checked++;
        if (ok) correct++;else wrongs.push({ w, typed, k });
        return;
      }
      if (a && typeof a === 'string' && a.trim()) {
        const ok = dir === 'dk' ? __okKO(a.trim(), w) : __okDE(a.trim(), w);
        marks[k] = ok;checked++;
        if (ok) correct++;else wrongs.push({ w, typed: a.trim(), k });
      }
    };
    dayWords.forEach((w, i) => handle(w, `${kp}-n-${i}`));
    revWords.forEach((w, i) => handle(w, `${kp}-r-${i}`));
    CARRY.forEach((w, i) => handle(w, `${kp}-c-${i}`));
    if (!checked) return;
    setResults((prev) => {const n = { ...prev };Object.keys(marks).forEach((k) => {if (n[k] === undefined) n[k] = marks[k];});return n;});
    const again = [];
    wrongs.forEach(({ w, typed, k }) => {
      wrongRef.current.add(k);
      const gW = WORDS.indexOf(w);
      if (gW >= 0) {
        setWrongMap((p) => bumpWrong(p, gW, typed));
        again.push(gW);
      }
      addLog('wrong', `오답 — ${wl(w)} · 입력: "${typed || '—'}"`);
    });
    if (again.length) {
      setReviewCleared((p) => {let n = null;again.forEach((g) => {if ((n || p)[g]) {if (!n) n = { ...p };delete n[g];}});return n || p;});
      reviewAgain(again);
    }
    addLog('test', `Day ${day + 1} 전체 확인 (${dir === 'dk' ? '독→한' : '한→독'} 주관식) — ${correct}/${checked} 정답`);
  }, [day, dir, dayWords, revWords, answers, results, addLog, reviewAgain]);

  const resetDay = useCallback(() => {
    const kp = `${mode[0]}${dir}-${day}`;
    setAnswers((p) => {const n = { ...p };Object.keys(n).forEach((k) => {if (k.startsWith(kp)) delete n[k];});return n;});
    setResults((p) => {const n = { ...p };Object.keys(n).forEach((k) => {if (k.startsWith(kp)) delete n[k];});return n;});
    setAccepted((p) => {const n = { ...p };Object.keys(n).forEach((k) => {if (k.startsWith(kp)) delete n[k];});return n;});
    if (mode === 'mc') setMcSeeds((p) => ({ ...p, [kp]: (p[kp] || 0) + 1 }));   // 객관식이면 이 Day·방향의 보기를 새로 섞는다
  }, [mode, dir, day]);

  return (
    React.createElement("div", { className: "app" },
    React.createElement(Sidebar, { day: day, setDay: setDay, mode: mode, dir: dir, results: results,
      name: name, setName: setName, studyProg: studyProg, testProg: testProg,
      revDone: Object.keys(reviewCleared).length, revTotal: Object.keys(reviewCleared).length + reviewPool.length }),
    React.createElement("main", { className: "main" },
    React.createElement(ProgressHeader, { studyProg: studyProg, testProg: testProg, name: name }),
    React.createElement("div", { className: "mhd" },
    React.createElement("div", { className: "mhd-left" },
    React.createElement("h1", { className: "mhd-day" }, "Day ", day + 1),
    React.createElement("span", { className: "mhd-name" }, NAMES[day], " · 새 단어 ", SIZES[day], "개 · 누적 ", off + SIZES[day], "개")
    ),
    React.createElement(MobileDays, { day: day, setDay: setDay }),
    React.createElement("div", { className: "tabs" },
    React.createElement("button", { className: `tab ${tab === 'study' ? 'on' : ''}`, onClick: () => setTab('study') }, "학습"),
    React.createElement("button", { className: `tab ${tab === 'test' ? 'on' : ''}`, onClick: () => setTab('test') }, "테스트"),
    React.createElement("button", { className: `tab ${tab === 'review' ? 'on' : ''}`, style: { whiteSpace: 'nowrap' }, onClick: () => setTab('review') }, "복습"),
    React.createElement("button", { className: `tab ${tab === 'rtest' ? 'on' : ''}`, style: { whiteSpace: 'nowrap' }, onClick: () => setTab('rtest') }, "복습 테스트"),
    React.createElement("button", { className: `tab ${tab === 'log' ? 'on' : ''}`, onClick: () => { if (tab === 'log') return; __logNotice(() => setTab('log')); } }, "기록")
    )
    ),
    React.createElement("div", { className: "mcontent" },
    React.createElement(MobileNav, { full: tab === 'log', name: name, setName: setName, studyProg: studyProg, testProg: testProg,
      revDone: Object.keys(reviewCleared).length, revTotal: Object.keys(reviewCleared).length + reviewPool.length }),
    React.createElement(TtsPanel, null),
    tab === 'study' ?
    React.createElement(StudyView, { dayIndex: day, dayWords: dayWords, globalStart: off,
      revealed: revealed, onToggleReveal: toggleReveal, onToggleRevealKey: toggleRevealKey, onToggleAll: toggleAll,
      mastery: mastery, onRate: rateWord, reviewWords: revWords, carryWords: CARRY, carryStart: TOTAL }) :
    tab === 'test' ?
    React.createElement(TestView, { dayIndex: day, newWords: dayWords, reviewWords: revWords, globalStart: off, carryWords: CARRY, carryStart: TOTAL,
      mode: mode, dir: dir, resetSeed: mcSeeds[`${mode[0]}${dir}-${day}`] || 0,
      answers: answers, results: results,
      onAnswer: setAnswer, onResult: setResult,
      onCheckAllFree: checkAllFree, onReset: resetDay, onRetry: retryOne, onAccept: acceptOne, accepted: accepted,
      onModeChange: setMode, onDirChange: setDir }) :
    tab === 'review' ?
    React.createElement(ReviewView, { pool: reviewPool, mastery: mastery, onRate: rateWord, wrongMap: wrongMap }) :
    tab === 'rtest' ?
    React.createElement(ReviewTestView, { pool: reviewPool, mode: mode, dir: dir, onModeChange: setMode, onDirChange: setDir,
      answers: answers, results: results, onAnswer: setAnswer, onResult: setResult, onRetry: retryOne,
      onAccept: acceptOne, accepted: accepted, onPass: reviewPass, onFail: reviewFail }) :

    React.createElement(LogView, { log: log, name: name, studyProg: studyProg, testProg: testProg, results: results, reviewPool: reviewPool, reviewCleared: reviewCleared,
      wrongMap: wrongMap, mastery: mastery, onImportCarry: importCarry, onBackup: () => buildBackup(stateRef.current, log) })

    )
    )
    ));

}

window.__ENGINE_ROOT = ReactDOM.createRoot(document.getElementById('root'));window.__ENGINE_ROOT.render(React.createElement(App, null));
})();
window.__okKO=__okKO;window.__okDE=__okDE;
</script>

<script id="voka-sync-js">
/* ===== VOKALAB 학습 기록 자동 저장 (학습 포탈 로그인 연동) =====
   학습 포탈에 학생으로 로그인한 브라우저(localStorage soda-portal:session)에서는 VOKALAB 기록을 저장 서버(soda-sync Worker)에 올리고,
   같은 학생이 다른 기기에서 올린 기록을 받아 이 브라우저의 기록과 맞춥니다. 로그인이 없으면 예전처럼 이 브라우저에만 저장합니다.

   - 저장하는 기록: 레벨별 목표(…plan), 주차 상태(…wN-state), 주차 학습 기록(…wN-log), 이름(voka-name). 시험용 학습(voka-ex-…)도 같습니다.
     관사·복수 훈련 기록(…art)도 레벨 접두어로 시작하므로 함께 올립니다.
     발음 설정(voka-tts-*)은 기기마다 다르므로 올리지 않습니다.
   - 바뀐 기록만 보냅니다. 마지막 변경 4초 뒤(계속 바뀌면 20초마다), 화면을 떠나거나 다른 앱으로 넘어갈 때 바로 보냅니다.
   - 다른 기기의 기록은 앱을 열 때, 화면으로 다시 돌아올 때, 1분 30초마다 받습니다. 열어 둔 주차의 기록이 바뀌었으면 그 주차 화면을 다시 엽니다.
   - 같은 기록을 두 기기에서 따로 바꾼 경우(인터넷이 끊긴 채 공부한 경우 등)
     학습 기록(log): 두 쪽을 합칩니다. 주차 상태(state): 나중에 바꾼 쪽을 바탕으로, 단어별 학습 상태는 단어마다 나중 것을 쓰고 빈 칸은 다른 쪽에서 채웁니다.
     목표·이름: 나중에 바꾼 쪽을 씁니다. 관사·복수 훈련(art): 명사마다 더 많이 답한 쪽(같으면 나중에 답한 쪽)을 쓰고, 횟수는 큰 값을 씁니다.
   - 이 기기에서 처음 연결할 때 서버와 이 기기에 같은 레벨의 서로 다른 기록이 있으면 레벨마다 이어서 쓸 쪽을 고르게 합니다.
     고르지 않은 쪽은 지우지 않고 서버에 보관합니다(키 ~bak:시각:l|s:원래 키, 앱으로는 내려오지 않음).

        (window.VokaSync && window.VokaSync.on() ? ' 학습 포탈 서버에 저장된 이 기록도 함께 지워져 다른 기기에서도 사라집니다.' : '') + '</p>' +
        '<div class="row"><button class="btn" id="m-no">취소</button><button class="btn danger" id="m-yes">삭제</button></div>', function (box, close) {
        box.querySelector('#m-no').onclick = close;
        box.querySelector('#m-yes').onclick = function () { ls.del(key(ctx)); close(); renderHome(); };
      });
    };
  }
  var dlgEl = null;
  function dialog(html, after) {
    closeDialog();
    dlgEl = document.createElement('div'); dlgEl.className = 'ov'; dlgEl.innerHTML = '<div class="dlg" role="dialog" aria-modal="true">' + html + '</div>';
    document.body.appendChild(dlgEl);
    after(dlgEl, closeDialog);
  }
  function closeDialog() { if (dlgEl) { dlgEl.remove(); dlgEl = null; } }

  /* ---------- 문제 화면 ---------- */
  var S = null;   // { ctx, mode, rid, queue:[{it, tries}], done:[], total, ans }
  function start(rid) {
    var ctx = cur.ctx, mode = cur.mode, d = load(ctx), T = today(), R = d[mode], seen = seenSet(ctx), due = [], fresh = [], ex = null;
    if (ctx.twin && ctx.twin.words && ctx.twin !== ctx.L) { ex = {}; ctx.twin.words.forEach(function (w) { ex[w.de] = 1; }); }
    function rank(it) { return seen[it.de] ? 0 : (ex && ex[it.de]) ? 1 : 2; }
    pool(ctx, mode).forEach(function (it) {
      if (rid && grp(it, mode) !== rid) return;
      var r = R[it.id];
      if (!r) fresh.push(it);
      else if (r[1] <= T && r[2] !== T) due.push(it);
    });
    due.sort(function (a, b) { return R[a.id][1] - R[b.id][1]; });
    fresh.sort(function (a, b) { return (rank(a) - rank(b)) || (a.wi - b.wi); });
    var list = due.slice(0, ROUND), room = ROUND - list.length;
    if (room > 0) list = list.concat(fresh.slice(0, Math.min(room, rid ? room : newLeft(d, mode))));
    if (!list.length) { renderHome(); return; }
    S = { ctx: ctx, mode: mode, rid: rid, queue: shuffle(list).map(function (it) { return { it: it, tries: 0 }; }), done: [], total: list.length, ans: null };
    renderQ(); top();
  }
  function quit() { S = null; renderHome(); top(); }
  function ruleName(S) { if (!S.rid) return ''; var r = (S.mode === 'a' ? C.AR_BY : C.PR_BY)[S.rid]; return r ? r.t : ''; }
  var SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  var MUTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z" fill="currentColor" stroke="none"/><path d="m16 9 6 6M22 9l-6 6"/></svg>';
  function renderQ() {
    var q = S.queue[0], it = q.it, mode = S.mode, doneN = S.done.length;
    var rn = ruleName(S);
    var head = '<div class="art-top"><button type="button" class="art-quit" id="art-quit">그만하기</button>' +
      '<div class="art-prog"><span>' + (doneN + 1 > S.total ? S.total : doneN + 1) + ' / ' + S.total + (q.tries ? ' · 다시' : '') + '</span>' + bar(pct(doneN, S.total)) + '</div>' +
      '<button type="button" class="art-snd" id="art-snd" aria-pressed="' + sndOn() + '" aria-label="정답 소리 ' + (sndOn() ? '끄기' : '켜기') + '" title="정답을 소리로 들려줍니다">' + (sndOn() ? SPK : MUTE) + '</button></div>';
    var word = mode === 'a'
      ? '<div class="art-word" lang="de"><span class="art-blank">___</span> ' + esc(it.sg) + '</div>'
      : '<div class="art-word" lang="de"><span class="art-art">' + esc(it.art.join('/')) + '</span> ' + esc(it.sg) + '</div><div class="art-ask">복수형은?</div>';
    var body = '<div class="art-q">' + (rn ? '<div class="art-chip">규칙 묶음 · ' + esc(rn) + '</div>' : '') + word + '<div class="art-ko">' + esc(it.ko) + '</div><div class="art-fb" id="art-fb" aria-live="polite"></div></div>';
    var foot = mode === 'a'
      ? '<div class="art-bot"><div class="art-abtn">' + ['der', 'die', 'das'].map(function (g, i) { return '<button type="button" class="art-a" data-a="' + g + '"><span>' + g + '</span><small>' + (i + 1) + '</small></button>'; }).join('') + '</div>' +
        '<div class="art-aux"><button type="button" class="art-idk" id="art-idk">모르겠어요</button></div><button type="button" class="btn primary big art-next" id="art-next" hidden>다음</button></div>'
      : '<div class="art-bot"><form class="art-form" id="art-form" autocomplete="off"><label class="art-in"><span lang="de">die</span><input id="art-inp" type="text" lang="de" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="복수형을 쓰세요" aria-label="복수형"></label>' +
        '<div class="art-keys"><button type="button" data-k="sg">단수형</button><button type="button" data-k="uml" title="마지막 a·o·u에 움라우트를 붙이거나 뺍니다">움라우트</button>' + ['ä', 'ö', 'ü', 'ß'].map(function (k) { return '<button type="button" data-k="' + k + '">' + k + '</button>'; }).join('') + '</div>' +
        '<div class="art-row2"><button type="button" class="btn art-idk2" id="art-idk">모르겠어요</button><button type="submit" class="btn primary" id="art-ok">확인</button></div></form>' +
        '<button type="button" class="btn primary big art-next" id="art-next" hidden>다음</button></div>';
    hub.innerHTML = '<div class="art-run" data-mode="' + mode + '">' + head + body + foot + '</div>';
    bindQ();
  }
  function bindQ() {
    hub.querySelector('#art-quit').onclick = quit;
    hub.querySelector('#art-snd').onclick = function () {
      ls.put(SND, sndOn() ? '0' : '1');
      var b = hub.querySelector('#art-snd'); b.innerHTML = sndOn() ? SPK : MUTE; b.setAttribute('aria-pressed', String(sndOn())); b.setAttribute('aria-label', '정답 소리 ' + (sndOn() ? '끄기' : '켜기'));
    };
    hub.querySelector('#art-next').onclick = next;
    hub.querySelector('#art-idk').onclick = function () { if (!S.ans) answer(false, null); };
    if (S.mode === 'a') {
      hub.querySelectorAll('.art-a').forEach(function (b) { b.onclick = function () { if (!S.ans) answer(S.queue[0].it.art.indexOf(b.getAttribute('data-a')) >= 0, b.getAttribute('data-a')); }; });
    } else {
      var inp = hub.querySelector('#art-inp');
      hub.querySelector('#art-form').onsubmit = function (e) { e.preventDefault(); if (S.ans) { next(); return; } var v = inp.value.trim(); if (!v) { inp.focus(); return; } answer(C.gradeP(v, S.queue[0].it), v); };
      hub.querySelectorAll('[data-k]').forEach(function (b) {
        b.onmousedown = function (e) { e.preventDefault(); };   // 입력 칸의 커서를 지킵니다
        b.onclick = function () { if (S.ans) return; typeKey(b.getAttribute('data-k'), inp); };
      });
      if (window.matchMedia && window.matchMedia('(hover: hover)').matches) setTimeout(function () { try { inp.focus(); } catch (e) {} }, 30);
    }
  }
  function typeKey(k, inp) {
    var v = inp.value, s0 = inp.selectionStart == null ? v.length : inp.selectionStart, s1 = inp.selectionEnd == null ? v.length : inp.selectionEnd;
    if (k === 'sg') { v = S.queue[0].it.sg; s0 = s1 = v.length; inp.value = v; }
    else if (k === 'uml') { var t = toggleUml(v); if (t !== null) inp.value = t; s0 = s1 = inp.value.length; }
    else { inp.value = v.slice(0, s0) + k + v.slice(s1); s0 = s1 = s0 + k.length; }
    try { inp.focus(); inp.setSelectionRange(s0, s1); } catch (e) {}
  }
  var BACK = { 'ä': 'a', 'ö': 'o', 'ü': 'u', 'Ä': 'A', 'Ö': 'O', 'Ü': 'U' };
  function toggleUml(w) {
    for (var k = w.length - 1; k >= 0; k--) {
      var c = w[k];
      if (BACK[c]) return w.slice(0, k) + BACK[c] + w.slice(k + 1);
      if (/[aouAOU]/.test(c)) { var p = k > 0 ? w[k - 1] : ''; if (/[uU]/.test(c) && /[eEäÄ]/.test(p)) continue; if (/[uU]/.test(c) && /[oO]/.test(p)) { k--; continue; } var u = C.uml(w.slice(0, k + 1)); return u === null ? null : u + w.slice(k + 1); }
    }
    return null;
  }
  /* 복수형에서 단수형과 달라진 곳(움라우트·어미)을 표시 */
  function markPl(sg, pl) {
    var u = C.uml(sg);
    if (pl.indexOf(sg) === 0) return esc(sg) + '<u>' + esc(pl.slice(sg.length)) + '</u>';
    if (u && pl.indexOf(u) === 0) {
      var i = 0; while (i < sg.length && sg[i] === u[i]) i++;
      var j = i; while (j < u.length && u[j] !== sg[j]) j++;
      return esc(u.slice(0, i)) + '<u>' + esc(u.slice(i, j)) + '</u>' + esc(u.slice(j)) + '<u>' + esc(pl.slice(u.length)) + '</u>';
    }
    var a = 0; while (a < sg.length && a < pl.length && sg[a] === pl[a]) a++;
    return esc(pl.slice(0, a)) + '<u>' + esc(pl.slice(a)) + '</u>';
  }
  function answer(ok, given) {
    var q = S.queue[0], it = q.it, first = q.tries === 0;
    q.tries++;
    if (first) record(it, ok, given);
    S.ans = { ok: ok, given: given };
    var mode = S.mode, fb = hub.querySelector('#art-fb'), lines = [];
    if (mode === 'a') {
      hub.querySelectorAll('.art-a').forEach(function (b) {
        var g = b.getAttribute('data-a'); b.disabled = true;
        if (it.art.indexOf(g) >= 0) b.classList.add('ok');
        else if (g === given) b.classList.add('no');
      });
      var w = hub.querySelector('.art-word');
      if (w) w.innerHTML = '<span class="art-art ok">' + esc(it.art.join('/')) + '</span> ' + esc(it.sg);
      var fa = C.fitsA(it, it.ra), m = C.msgA(it);
      if (it.art.length > 1) lines.push(esc(it.art.map(function (g) { return g + ' ' + it.sg; }).join(', ')) + ' 모두 씁니다.');
      var ca = C.cmpA(it);
      if (fa === true) lines.push(nb(m) + '.');
      else if (fa === false && ca) lines.push(nb(ca) + '.');
      else if (fa === false) lines.push('<b>규칙의 예외</b>입니다. ' + nb(m) + '.');
      else if (!ok && it.art.length === 1) lines.push('끝 모양으로 짐작하기 어려운 명사입니다. 관사와 함께 한 덩어리로 외우세요.');
      fb.innerHTML = '<div class="art-res ' + (ok ? 'ok' : 'no') + '">' + (ok ? '맞았습니다' : (given ? '틀렸습니다' : '정답 확인')) + ' <button type="button" class="art-say" id="art-say" aria-label="발음 듣기">' + SPK + '</button></div>' + (lines.length ? '<p>' + lines.join(' ') + '</p>' : '');
      var aux = hub.querySelector('.art-aux'); if (aux) aux.hidden = true;
    } else {
      var inp = hub.querySelector('#art-inp'); if (inp) { inp.readOnly = true; inp.parentNode.classList.add(ok ? 'ok' : 'no'); inp.blur(); }
      hub.querySelector('.art-keys').hidden = true; hub.querySelector('.art-row2').hidden = true;
      var fp = C.fitsP(it, it.rp), mp = C.msgP(it);
      var res = '<div class="art-res ' + (ok ? 'ok' : 'no') + '">' + (ok ? '맞았습니다' : (given ? '틀렸습니다' : '정답 확인')) + ' <button type="button" class="art-say" id="art-say" aria-label="발음 듣기">' + SPK + '</button></div>';
      res += '<div class="art-pl" lang="de">die ' + markPl(it.sg, it.pl[0]) + '</div>';
      if (it.pl.length > 1) lines.push('또는 die ' + it.pl.slice(1).map(esc).join(', die ') + '도 맞습니다.');
      lines.push('복수 유형: ' + nb(CLS[it.cls]) + (it.cls === 'x' ? '' : ' (' + esc(CLS_EX[it.cls]) + ')') + '.');
      var cp = C.cmpP(it);
      if (fp === true) lines.push(nb(mp) + '.');
      else if (cp) lines.push(nb(cp) + '.');
      else if (fp === false) lines.push('<b>규칙의 예외</b>입니다. ' + nb(mp) + '.');
      fb.innerHTML = res + '<p>' + lines.join(' ') + '</p>';
    }
    var say1 = hub.querySelector('#art-say'), text = mode === 'a' ? it.art[0] + ' ' + it.sg : 'die ' + it.pl[0];
    if (say1) say1.onclick = function () { say(text); };
    var nx = hub.querySelector('#art-next'); nx.hidden = false;
    setTimeout(function () { try { nx.focus({ preventScroll: true }); } catch (e) {} }, 0);
    var qref = q;
    function go(ms) { setTimeout(function () { if (S && S.queue[0] === qref && S.ans && S.ans.ok) next(); }, ms); }
    if (!(sndOn() && say(text, ok ? function () { go(300); } : null)) && ok) go(mode === 'a' ? 1100 : 1400);
  }
  function record(it, ok, given) {
    var ctx = S.ctx, mode = S.mode, d = load(ctx), T = today(), R = d[mode], old = R[it.id];
    if (old && old[2] === T) return;
    if (!old) { if (d.t.d !== T) d.t = { d: T, a: 0, p: 0 }; d.t[mode] = (+d.t[mode] || 0) + 1; }
    R[it.id] = C.review(old || null, ok, T);
    var h = d.h[T] || (d.h[T] = [0, 0, 0, 0]), o = mode === 'a' ? 0 : 2;
    h[o + 1]++; if (ok) h[o]++;
    if (mode === 'a') {
      var g = it.art[0], sa = d.sa[g] || (d.sa[g] = [0, 0]); sa[1]++; if (ok) sa[0]++;
      if (!ok && given && it.art.indexOf(given) < 0) { var ck = g + '>' + given; d.ca[ck] = (+d.ca[ck] || 0) + 1; }
    } else {
      var sp = d.sp[it.cls] || (d.sp[it.cls] = [0, 0]); sp[1]++; if (ok) sp[0]++;
    }
    save(ctx, d);
  }
  function next() {
    if (!S || !S.ans) return;
    try { if (window.VokaTTS) window.VokaTTS.stop(); } catch (e) {}
    var q = S.queue.shift();
    if (S.ans.ok) S.done.push(q);
    else S.queue.splice(Math.min(3, S.queue.length), 0, q);
    S.ans = null;
    if (!S.queue.length) { summary(); return; }
    renderQ();
  }
  function summary() {
    var ctx = S.ctx, mode = S.mode, rid = S.rid, d = load(ctx), c = counts(ctx, mode, d, rid), more = todayCount(c, d, mode, rid), left = leftToday(c, d, mode, rid);
    var first = S.done.filter(function (q) { return q.tries === 1; }).length, miss = S.done.filter(function (q) { return q.tries > 1; });
    var rn = ruleName(S);
    hub.innerHTML = '<div class="wrap narrow art-root">' + header(ctx, ctx.L.title + (rn ? ' · 규칙 묶음 ' + rn : ' · 오늘 훈련')) +
      '<section class="card art-sum"><h2>' + (mode === 'a' ? '관사' : '복수형') + ' 훈련 ' + S.done.length + '개를 마쳤습니다</h2>' +
      '<div class="art-big">' + first + '<small> / ' + S.done.length + '</small></div><p class="muted">처음 낸 답으로 ' + first + '개를 맞혔습니다' + (miss.length ? '. 틀린 ' + miss.length + '개는 내일 다시 나옵니다' : '') + '.</p>' +
      (miss.length ? '<h3>다시 볼 명사</h3><ul class="art-list">' + miss.map(function (q) { var it = q.it; return '<li><b lang="de">' + (mode === 'a' ? esc(full(it, 'a')) : esc(it.art.join('/') + ' ' + it.sg) + ' → die ' + markPl(it.sg, it.pl[0])) + '</b> <span>' + esc(it.ko) + '</span></li>'; }).join('') + '</ul>' : '') +
      '<div class="row">' + (more ? '<button type="button" class="btn primary" id="art-more">이어서 ' + more + '개</button>' : '') + '<button type="button" class="btn" id="art-home">훈련 홈으로</button></div>' +
      (more ? '<p class="muted art-left">' + (rid ? '이 묶음에서' : '오늘') + ' 남은 명사 ' + fmtN(left) + '개</p>' : '<p class="muted art-left">' + (rid ? '이 묶음에서 지금 할 명사를 모두 마쳤습니다.' : '오늘 할 명사를 모두 마쳤습니다. 내일 복습할 명사가 다시 나옵니다.') + '</p>') +
      '</section><footer class="ft">Sophia Deutsch Akademie</footer></div>';
    hub.querySelector('#art-back').onclick = function () { S = null; cur = null; ctx.back(); };
    hub.querySelector('#art-home').onclick = quit;
    var m = hub.querySelector('#art-more'); if (m) m.onclick = function () { start(rid); };
    S.finished = true;

  }

  /* 키보드: 1·2·3 = der·die·das, Enter = 다음 */
  document.addEventListener('keydown', function (e) {
    if (!S || S.finished || !hub.querySelector('.art-run') || e.altKey || e.ctrlKey || e.metaKey) return;
    if (S.mode === 'a' && !S.ans && /^[123]$/.test(e.key)) { e.preventDefault(); var b = hub.querySelectorAll('.art-a')[+e.key - 1]; if (b) b.click(); return; }
    if (S.ans && (e.key === 'Enter' || e.key === ' ') && !(S.mode === 'p' && document.activeElement && document.activeElement.id === 'art-inp')) { e.preventDefault(); next(); }
  });

  window.VokaArt = {
    levelTile: levelTile, fillLevels: fillLevels, open: open,
    isOpen: function () { return !!hub.querySelector('.art-root, .art-run'); },
    /* 다른 기기의 기록을 받았을 때: 훈련 홈이면 다시 그리고, 문제를 푸는 중이면 그대로 둡니다(답할 때마다 저장된 기록을 새로 읽어 고칩니다) */
    refresh: function () { if (cur && !S && hub.querySelector('.art-root')) renderHome(); },
    close: function () { S = null; cur = null; },
    /* 브라우저 뒤로 가기: 문제를 푸는 중이면 훈련 홈으로, 훈련 홈이면 들어온 화면으로 */
    back: function () { if (S) { quit(); return; } if (cur) { var b = cur.ctx.back; cur = null; b(); } }
  };
})();
</script>
<script>/* VOKA 단어장: 표지 → 레벨 선택 → 레벨별 목표·기록 허브 → 주차 학습 화면 */
(function () {
  var LEVELS = window.LEVELS;
  var hub = document.getElementById('hub'), rootEl = document.getElementById('root'), fab = document.getElementById('hub-fab');
  /* 단어 데이터(data/words.js)를 받지 못했을 때: 표지에 안내와 「다시 시도」를 보인다 */
  if (!LEVELS || !LEVELS.length) {
    var cta = document.getElementById('cv-go'), msg = document.getElementById('cv-msg');
    if (msg) msg.textContent = '단어를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 시도해 주세요.';
    if (cta) { cta.disabled = false; cta.classList.remove('loading'); cta.textContent = '다시 시도'; cta.onclick = function () { location.reload(); }; }
    rootEl.style.display = 'none'; fab.style.display = 'none';
    return;
  }
  var TOTAL_WORDS = 0; LEVELS.forEach(function (L) { TOTAL_WORDS += L.words.length; });
  var PAGE_TITLE = '독일어 단어장 A1–C1 · ' + String(TOTAL_WORDS).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '단어 | SODA Vokalab';
  var DAYMS = 86400000;
  var ls = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmtN(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  /* ---------- 모달 ---------- */
  var modalEl = null, hubStale = false;
  function modal(html, after) {
    closeModal();
    modalEl = document.createElement('div'); modalEl.className = 'ov';
    modalEl.innerHTML = '<div class="dlg">' + html + '</div>';
    document.body.appendChild(modalEl);
    if (after) after();

    var C = canon(), learned = 0, test = 0, rated = 0;
    for (var g = 0; g < w.size; g++) {
      var wd = SEQ[w.start + g]; if (!wd) continue;                    // 빈 자리(목록에서 뺀 단어)
      var c = C[wd.i]; if (!c) continue;
      if (c.m) { if (c.m.learned) learned++; if (c.m.rated) rated++; }
      if (c.t) test++;
    }
    return { learned: learned, test: test, rated: rated, size: cnt(w), st: st };
  }
  function accuracyAll() {
    var checked = 0, correct = 0, wt = 0, wc = 0, TW = { mdk: 1, mkd: 1, fdk: 2, fkd: 2 };
    for (var i = 0; i < plan.weeks.length; i++) {
      var st = ls.get(sk(i + 1), {}) || {};
      Object.keys(st.results || {}).forEach(function (k) {
        var m = k.match(/^([mf])(dk|kd)-\d+-(?:n|r|c)-\d+$/);
        if (!m) return;
        var w = TW[m[1] + m[2]] || 1;
        checked++; wt += w;
        if (st.results[k] === true) { correct++; wc += w; }
      });
    }
    return { checked: checked, correct: correct, pct: wt > 0 ? Math.round(wc / wt * 100) : 0 };
  }
  function allLogs() {
    var out = [];
    for (var i = 1; i <= plan.weeks.length + 40; i++) {
      var l = ls.get(lk(i), null);
      if (Array.isArray(l)) l.forEach(function (e) { if (e && e.ts) { e.__w = i; out.push(e); } });
    }
    out.sort(function (a, b) { return a.ts - b.ts; });
    return out;
  }

  /* ---------- 학습 기록 산출 ---------- */
  function computeStats() {
    var logs = allLogs(), days = {};
    var D = function (n) { return days[n] || (days[n] = { learnedDelta: 0, rated: 0, ms: 0, tc: 0, tn: 0 }); };
    /* 줄인 기록(type 'sum'): 그 주차·그 날짜의 통계는 요약 줄의 숫자를 쓰고, 같은 주차·날짜의 다른 줄은 세지 않는다 */
    var sums = {};
    logs.forEach(function (e) { if (e.type === 'sum' && e.s && e.s.d != null) { var k = e.__w + '|' + e.s.d; sums[k] = VSPACE.better(sums[k], e.s); } });
    Object.keys(sums).forEach(function (k) { var s = sums[k], r = D(s.d); r.learnedDelta += +s.ld || 0; r.rated += +s.r || 0; r.ms += +s.ms || 0; r.tc += +s.tc || 0; r.tn += +s.tn || 0; });
    logs.forEach(function (e, idx) {
      if (e.type === 'sum') return;
      if (sums[e.__w + '|' + dnum(e.ts)]) return;
      var d = dnum(e.ts), r = D(d), msg = String(e.msg || '');
      if (e.type === 'complete' && msg.indexOf('학습됨 —') === 0) r.learnedDelta++;
      if (e.type === 'review' && msg.indexOf('학습됨 → 학습 필요') === 0) r.learnedDelta--;
      if ((e.type === 'study' || e.type === 'complete' || e.type === 'review') && /· (알아요|몰라요)/.test(msg)) r.rated++;
      var m = msg.match(/— (\d+)\/(\d+) 정답/);
      if (m && (e.type === 'test' || e.type === 'rtest')) { r.tc += parseInt(m[1]); r.tn += parseInt(m[2]); }
      var nx = logs[idx + 1];
      if (nx && e.type !== 'stop' && e.type !== 'pause') {
        var gap = nx.ts - e.ts;
        if (gap > 0 && gap <= 5 * 60000) D(dnum(e.ts)).ms += gap;
      }
    });
    var keys = Object.keys(days).map(Number).sort(function (a, b) { return a - b; });
    var learnedNow = 0, testNow = 0;
    plan.weeks.forEach(function (_, i) { var s = weekStats(i); learnedNow += s.learned; testNow += s.test; });
    var cum = [], run = 0;
    keys.forEach(function (d) { run += days[d].learnedDelta; cum.push([d, run]); });
    var off = learnedNow - run;
    cum = cum.map(function (p) { return [p[0], Math.max(0, p[1] + off)]; });
    var totalMs = 0, tc = 0, tn = 0, active = 0;
    keys.forEach(function (d) { totalMs += days[d].ms; tc += days[d].tc; tn += days[d].tn; if (days[d].ms >= 60000 || days[d].rated > 0) active++; });
    // 연속 학습일
    var today = dnum(Date.now()), streak = 0, cursor = today;
    var act = {}; keys.forEach(function (d) { if (days[d].ms >= 60000 || days[d].rated > 0) act[d] = 1; });
    if (!act[cursor]) cursor--;
    while (act[cursor]) { streak++; cursor--; }
    return { days: days, keys: keys, cum: cum, learnedNow: learnedNow, testNow: testNow, totalMs: totalMs, active: active, streak: streak, tc: tc, tn: tn };
  }

  function expectedLine(stats) {
    // 목표 변경 이력을 반영한 계획선: 구간별로 주당 목표 / 7 단어씩 증가
    var hist = (plan.history || []).slice().sort(function (a, b) { return a.ts - b.ts; });
    if (!hist.length) return [];
    var pts = [], val = 0, lastD = dnum(hist[0].ts);
    var today = dnum(Date.now());
    var endD = Math.max(today, stats.keys.length ? stats.keys[stats.keys.length - 1] : today) + 7;
    pts.push([lastD, 0]);
    for (var i = 0; i < hist.length; i++) {
      var from = dnum(hist[i].ts), to = i + 1 < hist.length ? dnum(hist[i + 1].ts) : endD;
      var slope = hist[i].target / 7;
      if (i > 0) { /* 변경 시점의 계획값을 이어 붙인다 */ }
      var v0 = val;
      for (var d = from; d <= to; d++) { val = Math.min(N, v0 + (d - from) * slope); }
      pts.push([from, v0]); pts.push([to, val]);
    }
    return pts;
  }

  /* ---------- SVG 차트 ---------- */
  function niceMax(v) { if (v <= 5) return 5; var p = Math.pow(10, Math.floor(Math.log10(v))); var f = v / p; var n = f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10; return n * p; }
  function chartFrame(w, h, xmin, xmax, ymax, yfmt) {
    var L = 44, R = 12, T = 12, B = 28, iw = w - L - R, ih = h - T - B;
    var xs = function (x) { return L + (xmax === xmin ? iw / 2 : (x - xmin) / (xmax - xmin) * iw); };
    var ys = function (y) { return T + ih - (ymax === 0 ? 0 : y / ymax * ih); };
    var g = '';
    for (var i = 0; i <= 4; i++) {
      var yv = ymax * i / 4, y = ys(yv);
      g += '<line x1="' + L + '" y1="' + y + '" x2="' + (w - R) + '" y2="' + y + '" stroke="#E3E0D8" stroke-width="1"/>';
      g += '<text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="#6B6F76">' + (yfmt ? yfmt(yv) : Math.round(yv)) + '</text>';
    }
    var span = xmax - xmin, step = Math.max(1, Math.ceil(span / 6));
    for (var x = xmin; x <= xmax; x += step) {
      g += '<text x="' + xs(x) + '" y="' + (h - 8) + '" text-anchor="middle" font-size="11" fill="#6B6F76">' + dnumLabel(x) + '</text>';
    }
    return { g: g, xs: xs, ys: ys, L: L, R: R, T: T, B: B, iw: iw, ih: ih };
  }
  function emptyChart(msg) { return '<div class="empty">' + msg + '</div>'; }
  function lineChart(opts) {
    var all = []; opts.series.forEach(function (s) { all = all.concat(s.pts); });
    if (!all.length) return emptyChart('학습 기록이 쌓이면 그래프가 표시됩니다.');
    var xmin = Math.min.apply(null, all.map(function (p) { return p[0]; })), xmax = Math.max.apply(null, all.map(function (p) { return p[0]; }));
    if (xmax - xmin < 6) xmax = xmin + 6;
    var ymax = opts.ymax || niceMax(Math.max.apply(null, all.map(function (p) { return p[1]; })) * 1.05);
    var w = 640, h = 230, f = chartFrame(w, h, xmin, xmax, ymax, opts.yfmt);
    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" class="chart" role="img" aria-label="' + esc(opts.label) + '">' + f.g;
    opts.series.forEach(function (s) {
      if (!s.pts.length) return;
      var d = s.pts.map(function (p, i) { return (i ? 'L' : 'M') + f.xs(p[0]).toFixed(1) + ' ' + f.ys(p[1]).toFixed(1); }).join(' ');

      svg += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2.4" stroke-linejoin="round"' + (s.dash ? ' stroke-dasharray="6 5"' : '') + '/>';
      if (!s.dash) s.pts.forEach(function (p) { svg += '<circle cx="' + f.xs(p[0]).toFixed(1) + '" cy="' + f.ys(p[1]).toFixed(1) + '" r="3" fill="' + s.color + '"/>'; });
    });

  }
  function barChart(opts) {

        '<section class="card srs-end"><h2>' + queue.length + '개를 확인했습니다</h2><div class="srs-sum"><div><b>' + okN + '</b><span>기억함</span></div><div><b>' + noN + '</b><span>다시 외울 단어</span></div></div>' +
        (noN ? '<p class="muted">다시 외울 단어는 학습 필요로 돌아갔고 내일 「오늘 복습」에 다시 나옵니다.</p>' : '') +
        '<div class="row">' + (left ? '<button class="btn primary" id="srs-more" type="button">이어서 복습 (' + fmtN(left) + '개 남음)</button>' : '') + '<button class="btn" id="srs-home" type="button">목표·기록 허브로</button></div></section></div>';
      var mb = document.getElementById('srs-more'); if (mb) mb.onclick = openSrs;
      document.getElementById('srs-home').onclick = function () { render(); };
      window.scrollTo(0, 0); hub.scrollTop = 0;
    }
    draw();
  }
  function summary() {
    var p = ls.get(PK, null); if (!p) return null;
    plan = p; var l = 0; p.weeks.forEach(function (_, i) { l += weekStats(i).learned; });
    return { learned: l, cur: p.cur + 1, weeks: p.weeks.length, target: p.target };
  }
  /* 다른 기기에서 받은 기록이 열려 있는 주차를 바꾼 경우: 저장하지 않고 닫은 뒤 새 기록으로 다시 엽니다.
     다른 기기에서 목표를 바꾸거나 초기화해 이 주차가 없어졌으면 목표·기록 허브로 돌아갑니다 */
  function reopen() {
    if (curWeek === null) return;
    var i = curWeek;
    window.__VOKA_NO_FLUSH = true;
    try { if (window.__ENGINE_ROOT) window.__ENGINE_ROOT.unmount(); } catch (e) {}
    window.__ENGINE_ROOT = null; rootEl.innerHTML = '';
    plan = ls.get(PK, null);
    if (!plan || !plan.weeks || !plan.weeks[i]) {
      curWeek = null; rootEl.style.display = 'none'; fab.style.display = 'none'; document.body.classList.remove('voka-engine', 'voka-exam', 'voka-full');
      document.title = TITLE + ' — Interactive'; hub.style.display = ''; render(); window.scrollTo(0, 0);
      return;
    }
    launch(i);
  }
  /* 같은 브라우저의 다른 창에서 이 주차를 바꾼 경우(이 창이 뒤에 있을 때): 저장하지 않고 닫고 허브로 */
  function closeEngine() {
    if (curWeek === null) return;
    window.__VOKA_NO_FLUSH = true;
    try { if (window.__ENGINE_ROOT) window.__ENGINE_ROOT.unmount(); } catch (e) {}
    window.__ENGINE_ROOT = null; curWeek = null; rootEl.innerHTML = ''; rootEl.style.display = 'none'; fab.style.display = 'none'; document.body.classList.remove('voka-engine', 'voka-exam', 'voka-full');
    document.title = TITLE + ' — Interactive'; hub.style.display = ''; render(); window.scrollTo(0, 0);
  }
  var api = { render: render, back: backToHub, summary: summary, title: TITLE, total: REAL, reopen: reopen, close: closeEngine };
  return api;
}

  var apis = LEVELS.map(function (L) { return makeLevel(L, shell); });

  /* ---------- 시험용 학습: 레벨마다 시험 필수 단어만 담은 별도 학습 ---------- */
  var EXS = window.EXAM_SETS || {};
  var XLEVELS = LEVELS.map(function (L) {
    var ex = EXS[L.id]; if (!ex) return null;
    /* 시험용 순서(ex.seq)는 단어 번호 목록이고 한번 정한 순서를 바꾸지 않는다(새 시험용 단어는 끝에 붙임). 목록에서 뺀 단어의 자리는 null */
    var ids = ex.seq || L.words.filter(function (w) { return w.x; }).map(function (w) { return w.i; });
    var xseq = ids.map(function (id) { return (L.seq || L.words)[id] || null; });
    var ws = xseq.filter(function (w) { return !!w; });
    if (!ws.length) return null;
    return { id: L.id + '-x', baseId: L.id, base: L, seq: xseq, ids: ids, exam: true, prefix: 'voka-ex-' + L.id + '-', label: L.label, short: L.short + ' 시험용', name: L.name + ' 시험용',
      title: L.title + ' 시험용', sideLabel: L.sideLabel + ' 시험용', examName: ex.name, examNote: ex.note,
      desc: ex.name + ' 필수 어휘 ' + fmtN(ws.length) + '개', words: ws, allWords: L.words };
  });
  var xapis = XLEVELS.map(function (X) { return X ? makeLevel(X, shell) : null; });
  shell.twin = function (L) { var i = L.exam ? XLEVELS.indexOf(L) : LEVELS.indexOf(L); return i < 0 ? null : (L.exam ? LEVELS[i] : XLEVELS[i]); };
  shell.switchMode = function (L) { var i = L.exam ? XLEVELS.indexOf(L) : LEVELS.indexOf(L); if (i < 0) return; if (L.exam) enter(i); else enterX(i); window.scrollTo(0, 0); };

  /* ---------- 표지 ---------- */
  function lastPlace() {
    try { var o = JSON.parse(localStorage.getItem('voka-last') || 'null'); if (o && LEVELS[o.i] && (!o.x || XLEVELS[o.i])) return o; } catch (e) {}
    return null;
  }
  function showCover(keepHistory) {
    screen = 'cover'; current = null; closeModal(); hub.classList.remove('xmode');
    document.title = PAGE_TITLE;
    if (!document.getElementById('v-cover')) hub.innerHTML = window.__VOKA_COVER || '';
    var go = document.getElementById('cv-go'), msg = document.getElementById('cv-msg'), cnt = document.getElementById('cv-count'), more = document.getElementById('cv-more');
    if (go) { go.disabled = false; go.classList.remove('loading'); go.innerHTML = '시작하기 <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg>'; go.onclick = showLevels; }
    if (msg) msg.textContent = '';
    if (cnt) cnt.textContent = fmtN(TOTAL_WORDS) + ' Wörter';
    /* 이어서 하기: 이 기기에서 마지막으로 연 레벨로 바로 간다 */
    var lp = lastPlace();
    if (more) {
      if (lp) { more.hidden = false; more.textContent = '이어서 하기 · ' + LEVELS[lp.i].label + (lp.x ? ' 시험용' : ' 전체'); more.onclick = function () { if (lp.x) enterX(lp.i); else enter(lp.i); }; }
      else more.hidden = true;
    }
    if (!keepHistory) dropGuard();
    window.scrollTo(0, 0); hub.scrollTop = 0;
  }

  /* ---------- 레벨 선택 ---------- */
  function optTile(ex, i, n, d, sm) {
    var pct = sm ? Math.round(sm.learned / n * 100) : 0;
    return '<button type="button" class="lv-opt ' + (ex ? 'lv-x' : 'lv-main') + '" ' + (ex ? 'data-x' : 'data-i') + '="' + i + '" title="' + esc(d) + '">' +
      '<span class="lv-row"><span class="lv-k">' + (ex ? '시험용' : '전체') + '</span><span class="lv-n">' + fmtN(n) + '<small>단어</small></span></span>' +
      '<span class="lv-s">' + (sm ? sm.cur + '주차 · ' + pct + '%' : '시작 전') + '</span>' +
      '<span class="bar"><i style="width:' + pct + '%"></i></span></button>';
  }
  /* 단어장 PDF: vokalab/pdf/ 에 레벨마다 일반·시험용 한 벌씩 */
  var PDF_ICON = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3v10M6 9l4 4 4-4M4 16h12"/></svg>';
  function pdfLink(L, kind, text) {
    return '<a class="lv-pdf-a" href="pdf/vokalab-' + L.id + '-' + kind + '.pdf" download="Vokalab 단어장 ' + esc(L.label) + (kind === 'exam' ? ' 시험용' : ' 일반') + '.pdf" ' +
      'title="' + esc(L.label) + (kind === 'exam' ? ' 시험 필수 단어' : ' 전체 단어') + ' 암기용 PDF 내려받기">' + PDF_ICON + text + '</a>';
  }
  function pdfBlock(i, L, X) {
    return '<div class="lv-pdf"><span class="lv-pdf-t">암기용 PDF 내려받기</span><div class="lv-pdf-b">' +
      pdfLink(L, 'all', '일반') + (X ? pdfLink(L, 'exam', '시험용') : '') + '</div></div>';
  }
  function showLevels() {
    hub.classList.remove('xmode');
    shell.tick++;
    screen = 'levels'; current = null; closeModal(); guard();
    document.title = PAGE_TITLE;
    var gen = [], fach = [];   // 레벨(A1–C1)과 분야별 단어(L.cat === 'fach', 레벨 구분 없음)를 따로 묶어 보인다
    LEVELS.forEach(function (L, i) {
      var sm = apis[i].summary(), pct = sm ? Math.round(sm.learned / L.words.length * 100) : 0;
      var state = sm ? '<div class="lv-st"><b>' + sm.cur + '주차</b> 진행 중 · 주 ' + sm.target + '개 목표 · 총 ' + sm.weeks + '주</div><div class="bar"><i style="width:' + pct + '%"></i></div><div class="lv-p">학습됨 ' + fmtN(sm.learned) + ' / ' + fmtN(L.words.length) + ' (' + pct + '%)</div>'
        : '<div class="lv-st">아직 시작하지 않았습니다</div><div class="bar"><i style="width:0"></i></div><div class="lv-p">전체 ' + fmtN(L.words.length) + '단어</div>';
      var X = XLEVELS[i];
      (L.cat === 'fach' ? fach : gen).push('<div class="lv"><span class="lv-big">' + esc(L.label) + '</span><span class="lv-nm">' + esc(L.sub || L.name.replace(/^[A-C][0-9](-[A-C][0-9])?\s*/, '')) + '</span><div class="lv-opts">' +
        optTile(false, i, L.words.length, L.short + ' 어휘 전체', sm) +
        (X ? optTile(true, i, X.words.length, X.examName + ' 필수', xapis[i].summary()) : '') +
        (window.VokaArt ? window.VokaArt.levelTile(i) : '') + '</div>' + pdfBlock(i, L, X) + '</div>');
    });
    var cards = gen.join('') + '</div>' + (fach.length ? '<div class="lvs-h"><b>분야별 단어</b><span>레벨 구분 없이 한 목록으로 학습합니다</span></div><div class="lvs">' + fach.join('') : '');
    hub.innerHTML =
      '<div class="wrap narrow"><header class="hd"><img class="logo" src="' + window.__LOGO + '" alt=""><div><h1>VOKALAB</h1><p class="sub">학습할 레벨을 선택하세요</p>' + syncBadge() + '</div><div class="hd-a"><button class="btn" id="btn-cover">표지</button></div></header>' +
      '<div class="lvs">' + cards + '</div>' +
      '<section class="card"><h2>데이터 관리</h2>' + syncNote('levels', '<p class="muted">모든 레벨의 기록은 이 브라우저에만 저장됩니다. 기기를 바꾸거나 브라우저 데이터를 지우기 전에 백업하세요.</p>') +
      '<div class="row"><button class="btn" id="btn-bk">전체 백업 저장</button><label class="btn">전체 백업 불러오기<input type="file" id="file-bk" accept=".json,application/json" hidden></label></div>' +
      spaceBlock() + '</section>' +
      '<footer class="ft">Sophia Deutsch Akademie</footer></div>';
    var bsp = document.getElementById('btn-space');
    if (bsp) bsp.onclick = function () {
      modal('<h2>지난 주차 활동 기록 정리</h2><p>진행 중인 주차와 바로 앞 주차를 뺀 지난 주차에서, 단어마다 남긴 활동 기록(알아요·몰라요·오답 한 줄씩)을 날짜별 요약 한 줄로 바꿉니다.</p><p>학습됨·테스트 통과·오답 노트 같은 학습 상태와 허브의 통계는 그대로입니다. 지난 주차의 「기록」 탭에서 단어별 줄만 보이지 않게 됩니다. 되돌릴 수 없으니 필요하면 먼저 전체 백업을 저장하세요.</p><div class="row"><button class="btn" id="m-no">취소</button><button class="btn primary" id="m-ok">정리하기</button></div>', function () {
        document.getElementById('m-no').onclick = closeModal;
        document.getElementById('m-ok').onclick = function () { var r = VSPACE.run(allPrefixes(), 1, null); closeModal(); showLevels(); modal('<h2>정리했습니다</h2><p>' + (r.weeks ? r.weeks + '개 주차의 기록을 줄여 약 ' + Math.round(r.freed / 1024) + 'KB를 비웠습니다.' : '줄일 기록이 없습니다.') + '</p><div class="row"><button class="btn primary" id="m-no">확인</button></div>', function () { document.getElementById('m-no').onclick = closeModal; }); };
      });
    };
    hub.querySelectorAll('.lv-main').forEach(function (b) { b.onclick = function () { enter(parseInt(b.dataset.i)); }; });
    hub.querySelectorAll('.lv-x').forEach(function (b) { b.onclick = function () { enterX(parseInt(b.dataset.x)); }; });
    hub.querySelectorAll('.lv-art').forEach(function (b) { b.onclick = function () { artOpen(parseInt(b.dataset.artL)); }; });
    if (window.VokaArt) window.VokaArt.fillLevels(hub);
    document.getElementById('btn-cover').onclick = function () { showCover(); };
    document.getElementById('btn-bk').onclick = backupAll;
    document.getElementById('file-bk').onchange = function (e) { restoreAll(e.target.files[0]); };
    window.scrollTo(0, 0); hub.scrollTop = 0;
  }
  /* 저장 공간 */
  function allPrefixes() { return LEVELS.map(function (L) { return L.prefix; }).concat(XLEVELS.filter(Boolean).map(function (X) { return X.prefix; })); }
  function spaceBlock() {
    var u = VSPACE.usage(), pct = Math.min(100, Math.round(u.all / 2500000 * 100));
    return '<div class="sp"><div class="sp-h"><b>저장 공간</b><span>' + (u.all / 1048576).toFixed(2) + 'MB 사용 · Vokalab ' + (u.voka / 1048576).toFixed(2) + 'MB</span></div>' +
      '<div class="bar"><i class="' + (pct >= 80 ? 'warn' : '') + '" style="width:' + pct + '%"></i></div>' +
      '<p class="muted">이 사이트의 학습 앱이 함께 쓰는 브라우저 저장 공간입니다(기기에 따라 2.5~5MB). 공간이 모자라면 지난 주차의 단어별 활동 기록부터 자동으로 줄입니다.</p>' +
      '<div class="row"><button class="btn" id="btn-space">지난 주차 활동 기록 정리</button></div></div>';
  }
  /* 사용량이 한도에 가까우면 오래된 주차(진행 중 주차에서 3주 넘게 지난 것)의 단어별 기록을 줄인다 */
  function autoSpace() { try { if (VSPACE.usage().all > VSPACE.LIMIT) VSPACE.run(allPrefixes(), 3, window.__CFG && rootEl.style.display !== 'none' ? window.__CFG.logKey : null); } catch (e) {} }
  var guarded = false, skipPop = 0;
  function guard() { if (guarded) return; try { history.pushState({ voka: 1 }, ''); guarded = true; } catch (e) {} }
  function dropGuard() { if (!guarded) return; guarded = false; skipPop++; try { history.back(); } catch (e) { skipPop--; } }
  function goBack() {
    if (modalEl) { closeModal(); return true; }
    var hint = document.querySelector('.hint-ov .hint-x'); if (hint) { hint.click(); return true; }
    if (rootEl.style.display !== 'none' && window.__ENGINE_ROOT) { if (current && !fab.disabled) current.back(); return true; }
    if (window.VokaArt && window.VokaArt.isOpen() && window.VokaArt.back) { window.VokaArt.back(); return screen !== 'cover'; }
    if (screen === 'level' && current && hub.querySelector('.srs-run')) { current.render(); return true; }   // 오늘 복습 → 허브
    if (screen === 'level') { showLevels(); return true; }
    if (screen === 'levels') { showCover(true); return false; }
    return false;
  }
  window.addEventListener('popstate', function () {
    if (skipPop > 0) { skipPop--; return; }
    guarded = false;
    if (goBack()) guard();
  });
  function remember(i, x) { try { localStorage.setItem('voka-last', JSON.stringify({ i: i, x: x ? 1 : 0, t: Date.now() })); } catch (e) {} }
  function enter(i) { gate(function () { guard(); remember(i, 0); screen = 'level'; current = apis[i]; document.title = LEVELS[i].title; apis[i].render(); hub.scrollTop = 0; }); }
  /* 관사·복수 훈련(voka-art-js): 레벨의 모든 명사로 엽니다. 기록은 <레벨 접두어>art */
  function artOpen(i) { gate(function () { guard(); var L = LEVELS[i]; window.VokaArt.open({ L: L, base: L, twin: XLEVELS[i] || null, back: showLevels, backLabel: '← 레벨 선택' }, 'a'); hub.scrollTop = 0; }); }
  function enterX(i) { gate(function () { guard(); remember(i, 1); screen = 'level'; current = xapis[i]; document.title = XLEVELS[i].title; xapis[i].render(); hub.scrollTop = 0; }); }
  function rerender() { if (screen === 'level' && current) current.render(); else if (screen === 'levels') showLevels(); else showCover(); }

  /* 학습 기록 자동 저장이 다른 기기의 기록을 받은 뒤 부릅니다 */
  window.VokaHub = {
    refresh: function () {
      if (rootEl.style.display !== 'none' || screen === 'cover') return;  // 주차 학습 화면에서는 허브로 돌아올 때 다시 그립니다
      if (window.VokaArt && window.VokaArt.isOpen()) { window.VokaArt.refresh(); return; }  // 관사·복수 훈련 화면은 그 화면이 다시 그립니다
      if (modalEl) { hubStale = true; return; }
      if (hub.querySelector('.srs-run')) return;                              // 오늘 복습 중에는 화면을 바꾸지 않는다(답할 때마다 기록을 새로 읽어 고친다)
      var a = document.activeElement;
      if (a && hub.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { setTimeout(window.VokaHub.refresh, 2000); return; } // 입력 중인 칸은 지우지 않음
      rerender();
    },
    engineOpen: function () { return rootEl.style.display !== 'none' && !!window.__ENGINE_ROOT; },
    /* 저장이 실패했을 때 학습 화면이 부른다: 지난 주차 기록을 줄여 자리를 만든다. 비운 것이 있으면 true */
    freeSpace: function (skipKey) {
      var lk = window.__CFG ? window.__CFG.logKey : null, r = VSPACE.run(allPrefixes(), 1, lk);
      if (!r.freed) r = VSPACE.run(allPrefixes(), 0, lk);
      return r.freed > 0;
    },
    reopen: function () { if (current && current.reopen) current.reopen(); },
    close: function () { if (current && current.close) current.close(); }
  };
  fab.onclick = function () { if (current) current.back(); };
  setTimeout(autoSpace, 3000);
  rootEl.style.display = 'none'; fab.style.display = 'none'; document.body.classList.remove('voka-engine');
  showCover(true);
})();
</script>

.a2hs-c p{margin:0 0 16px;font-size:15.5px;line-height:1.6;word-break:keep-all}
.a2hs-c p.n{margin:6px 0 18px;padding-top:14px;border-top:1px solid #E7E6E1;font-size:14px;color:#6B6B66}
.a2hs-c svg{display:inline-block;width:19px;height:19px;vertical-align:-4px;margin:0 2px}
.a2hs-go,.a2hs-ok{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border:0;border-radius:10px;background:#384568;color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none}
.a2hs-go{margin:0 0 20px}
.a2hs-ok.is-ghost{background:#ECEDF3;color:#384568}
.a2hs-ok:hover,.a2hs-go:hover{filter:brightness(1.12)}
.a2hs-sheet :focus-visible,.a2hs-btn:focus-visible{outline:3px solid #9DA6C6;outline-offset:3px}
@media (min-width:641px){.a2hs-sheet{align-items:center}.a2hs-box{margin:0}}
@media print{.a2hs-btn,.a2hs-sheet{display:none!important}}
</style>
<script id="a2hs-js">
(function(){
  if (location.protocol === 'file:') return;
  var ua = navigator.userAgent || '';
  var standalone = navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  var kakao = /KAKAOTALK/i.test(ua);
  var inapp = kakao || /NAVER\(inapp|Instagram|FBAN|FBAV|FB_IAB|Line\/|DaumApps/i.test(ua);
  var deferred = null, sheet = null, lastFocus = null;
  function can(){ return !standalone && !!(deferred || ios || android || inapp); }
  function name(){ var m = document.querySelector('meta[name="apple-mobile-web-app-title"]'); return (m && m.content) || document.title; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
  function guide(){
    var n = esc(name());
    if (inapp) {
      var url = location.href.split('#')[0];
      return { t: '브라우저에서 열어 주세요',
        c: '<p>카카오톡 같은 앱 안에서 연 화면에서는 홈 화면에 추가할 수 없어요.</p>' +
          (kakao ? '<a class="a2hs-go" href="kakaotalk://web/openExternal?url=' + encodeURIComponent(url) + '">다른 브라우저로 열기</a>' : '') +
          '<ol><li>화면 위나 아래의 <b>⋮</b> 또는 <b>⋯</b> 메뉴를 누르세요.</li><li><b>다른 브라우저로 열기</b>(아이폰은 <b>Safari로 열기</b>)를 누르세요.</li><li>' +
          (ios ? 'Safari' : 'Chrome') + '에서 다시 <b>홈 화면에 앱 추가</b>를 누르세요.</li></ol>', go: true };
    }
    if (ios) {
      return { t: '홈 화면에 추가',
        c: '<ol><li>Safari의 공유 버튼 ' + SHARE + '을 누르세요. 버튼이 보이지 않으면 <b>⋯</b> 메뉴 안에 있어요.</li>' +
          '<li><b>홈 화면에 추가</b>를 누르세요.</li><li>홈 화면에 생긴 <b>' + n + '</b> 아이콘으로 여세요.</li></ol>' +
          '<p class="n">학습 기록은 홈 화면 앱과 Safari에 따로 저장돼요. 아이콘으로 연 앱에서 공부하세요.</p>' };
    }
    return { t: '홈 화면에 추가',
      c: '<ol><li>브라우저 오른쪽 위나 아래의 메뉴 <b>⋮</b> 또는 <b>≡</b>를 누르세요.</li>' +
        '<li><b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 누르세요.</li><li>홈 화면에 생긴 <b>' + n + '</b> 아이콘으로 여세요.</li></ol>' };
  }
  function build(){
    if (sheet) return;
    sheet = document.createElement('div');
    sheet.className = 'a2hs-sheet'; sheet.hidden = true;
    sheet.setAttribute('role', 'dialog'); sheet.setAttribute('aria-modal', 'true'); sheet.setAttribute('aria-labelledby', 'a2hs-t');
    sheet.innerHTML = '<div class="a2hs-bg" data-close></div><div class="a2hs-box" tabindex="-1"><h2 class="a2hs-t" id="a2hs-t"></h2><div class="a2hs-c"></div><button type="button" class="a2hs-ok" data-close>확인</button></div>';
    sheet.addEventListener('click', function(e){ if (e.target.closest('[data-close]')) close(); });
    document.body.appendChild(sheet);
  }
  function open(){
    build();
    var g = guide();
    sheet.querySelector('.a2hs-t').textContent = g.t;
    sheet.querySelector('.a2hs-c').innerHTML = g.c;
    var ok = sheet.querySelector('.a2hs-ok');
    ok.className = 'a2hs-ok' + (g.go ? ' is-ghost' : '');
    ok.textContent = g.go ? '닫기' : '확인';
    lastFocus = document.activeElement;
    sheet.hidden = false;
    sheet.querySelector('.a2hs-box').focus();
  }
  function close(){
    if (!sheet || sheet.hidden) return;
    sheet.hidden = true;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function onClick(){
    if (deferred && !inapp) {
      var d = deferred; deferred = null;
      d.prompt();
      (d.userChoice || Promise.resolve()).then(refresh, refresh);
      return;
    }
    open();
  }
  function refresh(){
    var list = document.querySelectorAll('.a2hs-btn');
    for (var i = 0; i < list.length; i++) list[i].hidden = !can();
  }
  /* 표지가 그려질 때마다(독해 훈련처럼 나중에 그려지는 표지 포함) 시작 버튼 아래에 붙인다 */
  function mount(){
    var heroes = document.querySelectorAll('.hero, .uc-hero');
    for (var i = 0; i < heroes.length; i++) {
      var h = heroes[i];
      if (h.querySelector('.a2hs-btn')) continue;
      var cta = h.querySelector('.cta, .uc-cta');
      if (!cta) continue;
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'a2hs-btn'; b.textContent = '홈 화면에 앱 추가'; b.hidden = !can();
      b.addEventListener('click', onClick);
      cta.parentNode.insertBefore(b, cta.nextSibling);
    }
  }
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred = e; refresh(); });
  window.addEventListener('appinstalled', function(){ deferred = null; standalone = true; refresh(); close(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
  function start(){
    mount();
    if (window.MutationObserver) new MutationObserver(mount).observe(document.body, { childList: true, subtree: true });
  }
  if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
})();
</script>

</body></html>
