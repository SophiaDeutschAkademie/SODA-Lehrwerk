<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>독일어 전치사의 모든 것 · SODA PRÄPOSITIONEN</title>
<style>
:root{--bg:#faf8f3;--ink:#1f2937;--navy:#1f2d4a;--line:#e3ddd0;--card:#fff;--muted:#6b7280;
--akk:#2f5d8a;--akkbg:#e8f0f8;--dat:#2f7a6a;--datbg:#e6f3ef;--gen:#8a6a3a;--genbg:#f4ede1;--wec:#6a4c8a;--wecbg:#efe9f6;--red:#8a4a4a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.65}
nav{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px 12px;z-index:5;justify-content:center}
nav button{border:0;background:transparent;padding:9px 14px;border-radius:8px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.on{background:var(--navy);color:#fff}
main{max-width:960px;margin:0 auto;padding:24px 16px 80px}
section{display:none}section.on{display:block}
h2{font-size:21px;color:var(--navy);margin:8px 0 6px}
.lead{color:var(--muted);margin:0 0 18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}
.note{border-left:3px solid var(--navy);padding:8px 14px;margin:12px 0;background:#f3f1ea;font-size:14.5px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.k-공간{background:var(--akkbg);color:var(--akk)}.k-시간{background:var(--datbg);color:var(--dat)}.k-동사{background:var(--genbg);color:var(--gen)}.k-x{background:var(--wecbg);color:var(--wec)}
.case{background:#eee;color:#555}.lv{background:#f1ede2;color:#6b5a3a}
.de{font-weight:600}.ko{color:var(--muted);font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px;align-items:center}
.tools input{flex:1;min-width:180px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff}
.tools .lab{font-size:13px;color:var(--muted);min-width:34px}
.chip{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:99px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.count{font-size:13px;color:var(--muted);margin:4px 0 0}
.entry{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
.eh{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.eh svg{width:150px;height:100px;flex:none;background:#fcfbf8;border:1px solid var(--line);border-radius:10px}
.eh .t{flex:1;min-width:200px}
.eh .p{font-size:30px;font-weight:700;color:var(--navy);line-height:1.25}
.eh .p .pill{vertical-align:middle;margin-left:4px}
.eh .core{font-size:16.5px;font-weight:600;margin-top:4px}
.sense{display:grid;grid-template-columns:64px 1fr;gap:4px 12px;padding:9px 0;border-top:1px solid var(--line)}
.sense:first-of-type{margin-top:14px}
.link{margin-top:12px;background:#f3f1ea;border-radius:10px;padding:12px 16px;font-size:14.5px}
.flow{margin-top:8px}
.st{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:8px 0;border-top:1px dashed #d8d1c0}
.st:first-child{border-top:0}
.st .n{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.st .pill{margin-right:4px}
.tipline{margin-top:8px;padding:9px 12px;background:#fff;border:1px solid var(--line);border-radius:8px;font-weight:600;color:var(--navy)}
.more{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.more>b{color:var(--navy);font-size:15px}
.more h4{font-size:14px;margin:14px 0 6px;color:var(--navy)}
.more table{margin:4px 0;font-size:14px;border-radius:8px}
.more th{white-space:nowrap}
.more ul{margin:4px 0;padding-left:20px}.more li{margin:3px 0}
.err{padding:7px 0;border-top:1px dashed var(--line)}
.err:first-of-type{border-top:0}
.err .x{color:var(--red);text-decoration:line-through}
.err .o{color:var(--dat);font-weight:600}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:8px 0 18px;font-size:15px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f1ede2;font-size:13px;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:9px;font:inherit;font-size:14px;cursor:pointer}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.row{display:flex;gap:8px;justify-content:center;margin:10px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.opts button{padding:12px;border:1px solid var(--line);background:var(--card);border-radius:10px;font:inherit;font-size:16px;cursor:pointer}
.opts button.ok{background:var(--datbg);border-color:var(--dat);color:var(--dat);font-weight:700}
.opts button.no{background:#f6ecec;border-color:#b48a8a;color:var(--red)}
.q{font-size:20px;font-weight:600;color:var(--navy)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--navy);width:0}
.center{text-align:center}
.plink{color:var(--navy);font-weight:700;cursor:pointer;border-bottom:1px dotted var(--navy)}
@media print{nav,.tools,.row,.dbar{display:none}section{display:block!important;page-break-after:always}.entry{break-inside:avoid}}
@media(max-width:520px){.opts{grid-template-columns:1fr}header h1{font-size:24px}.eh svg{width:120px;height:80px}.sense{grid-template-columns:1fr}}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:5px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font:inherit;color:inherit}
.tile:hover,.tile:focus-visible{border-color:var(--navy);outline:none;box-shadow:0 2px 8px rgba(31,45,74,.08)}
.tile .n{font-size:20px;font-weight:700;color:var(--navy);line-height:1.2}
.tile .c{font-size:13px;color:var(--muted);line-height:1.45}
.grp{margin:22px 0}
.gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.gh h3{margin:0;font-size:17px;color:var(--navy)}
.dbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:53px;background:var(--bg);padding:8px 0;z-index:4}
.dbar .sp{flex:1}
.ex{margin-top:7px;padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:8px}
.ex .de{font-weight:600}
.qtype{margin-bottom:4px}
.btn:disabled{opacity:.4;cursor:default}
h3{color:var(--navy)}

/* ───────── 표지 ───────── */
[hidden]{display:none!important}
.view{animation:viewIn .5s cubic-bezier(.2,.7,.2,1) both}
.view.leave{animation:viewOut .26s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes viewOut{to{opacity:0;transform:translateY(-12px)}}

.cover{--navy:#384568;--bg:#FAFAF8;--ink:#1E1E1E;--muted:#666;--line:#E0E0DB;font-family:"SODA Latin","Pretendard Variable","Pretendard","Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;max-width:none;margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;padding:clamp(24px,4vw,48px) clamp(24px,7vw,112px);padding-bottom:max(clamp(24px,3vw,36px),env(safe-area-inset-bottom));background:var(--bg)}
.brand{display:flex;align-items:center;gap:18px;animation:fade .9s .05s ease both}
.brand img{height:58px;width:auto;display:block}
.brand-t{display:flex;flex-direction:column;line-height:1.25}
.brand-t b{font-size:21px;font-weight:700;letter-spacing:.2px}
.brand-t span{font-size:15px;color:var(--muted);font-weight:500}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:clamp(48px,10vh,120px) 0}
h1.title{font-size:clamp(34px,11.2vw,140px);line-height:1.02;letter-spacing:-.045em;color:var(--navy);margin:0;animation:rise 1s .15s cubic-bezier(.2,.7,.2,1) both}
h1.title span{display:block}
h1.title .t1{font-weight:800}
h1.title .t2{font-weight:300;color:var(--ink);letter-spacing:-.04em}
.cta{margin-top:clamp(40px,7vh,64px);align-self:flex-start;display:inline-flex;align-items:center;gap:14px;height:56px;padding:0 26px 0 30px;border:0;border-radius:10px;background:var(--navy);color:#fff;font:inherit;font-size:16px;font-weight:700;letter-spacing:.2px;cursor:pointer;transition:background .2s,gap .25s cubic-bezier(.2,.7,.2,1);animation:rise 1s .45s cubic-bezier(.2,.7,.2,1) both}
.cta svg{width:18px;height:18px}
.cta:hover{background:#2C3754;gap:20px}
.cover-foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--line);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;animation:fade 1s .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* 앱 상단 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:960px;margin:0 auto;padding:22px 16px}
.top-brand{display:flex;align-items:center;gap:12px;min-width:0}
.top-brand img{height:34px;width:auto}
.top-brand b{font-size:15px;font-weight:800;letter-spacing:.14em;white-space:nowrap;color:var(--ink)}
.top-brand span{font-size:12.5px;color:var(--muted);font-weight:500;display:block;letter-spacing:.2px;line-height:1.2}
.back{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;font-weight:600;color:#444;text-decoration:none;transition:border-color .15s,color .15s}
.back:hover{border-color:var(--navy);color:var(--navy)}
.back svg{width:14px;height:14px}
@media(max-width:520px){.top-brand span{display:none}.top-brand b{font-size:13px;letter-spacing:.1em}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.001ms!important}}
@media print{#cover,.top{display:none!important}#app{display:block!important}}

/* 헷갈리는 쌍 */
.pcat{margin:28px 0 10px;font-size:17px;color:var(--navy);padding-bottom:6px;border-bottom:1px solid var(--line)}
.pair{display:grid;grid-template-columns:max-content minmax(0,1fr) minmax(0,1.4fr);column-gap:22px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 18px 6px;margin:12px 0}

.phead{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-4px -18px 4px;padding:12px 18px;background:#eef1f6;border-bottom:1px solid #d9dfea;border-radius:14px 14px 0 0}
.ptag{background:#fff;border:1px solid #c5cee0;border-radius:99px;padding:3px 13px;font-size:15px;font-weight:700;color:var(--navy);white-space:nowrap}
.pctx{font-size:13px;font-weight:700;color:#5a6782;margin-right:2px;white-space:nowrap}
.pcount{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
.pi{grid-column:1/-1;display:grid;grid-template-columns:subgrid;column-gap:22px;row-gap:4px;padding:11px 0;align-items:start}
@supports not (grid-template-columns:subgrid){.pi{grid-template-columns:minmax(150px,max-content) minmax(0,1fr) minmax(0,1.4fr)}}
.pi+.pi{border-top:1px solid var(--line)}
.pi .pn{font-size:17px;font-weight:700;color:var(--navy);white-space:nowrap}
.pi .pd{font-size:14.5px;padding-top:2px}
.pi .pe .de{font-weight:600}
.pi .pe .ko{margin-top:2px}
@media(max-width:640px){.pair{display:block}.pcount{display:none}.pi{display:block}.pi .pn{white-space:normal;margin-bottom:2px}.pi .pd{padding-top:0;margin-bottom:4px}}

/* 전치사에 관하여 */
.wq .who{display:block;font-size:12.5px;font-weight:700;letter-spacing:.04em;color:#5a6782;margin-bottom:6px}
.wl{margin:14px 0 4px;padding:12px 16px;background:#e6f3ef;border-radius:10px;line-height:1.8}
.wl>b{display:block;color:var(--dat);margin-bottom:4px}
.wl ul{margin:0;padding-left:20px}.wl li{margin:5px 0}
.wsub{margin:6px 0;padding-left:22px}.wsub li{margin:3px 0}
.wtl{max-width:620px;margin:12px auto}.wcard.wtl svg{max-width:none;width:100%}

.wq{margin:14px 0;padding:12px 16px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--navy);border-radius:8px;line-height:1.8}
.wsec h4{font-size:15.5px;color:var(--navy);margin:20px 0 6px}

.wsec{margin:30px 0}
.wsec h3{font-size:19px;color:var(--navy);margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--navy)}
.wsec p{margin:8px 0 12px;line-height:1.8}
.wsec td.rk{font-weight:600;white-space:nowrap}
.wpair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 14px}
.wcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:center}
.wcard svg{width:100%;max-width:220px;height:auto;display:block;margin:0 auto 6px}
.wcard .pill{margin-top:8px}
.wsteps{margin:6px 0 14px;padding-left:22px}.wsteps li{margin:6px 0;line-height:1.7}
@media(max-width:560px){.wpair{grid-template-columns:1fr}.wsec table{font-size:13.5px}.wsec th,.wsec td{padding:7px 8px}}

vor:[
["그림","보는 사람(눈)과 상자 사이에 공이 있는 모습입니다. 앞은 내가 바라보는 쪽이므로 공은 나와 마주 서 있습니다. '앞', '먼저', '마주함'이 vor의 핵심입니다."],
["공간","앞에 있으면 3격, 앞으로 가면 4격입니다.","Das Auto steht vor dem Haus. / Ich fahre das Auto vor das Haus.","자동차가 집 앞에 서 있습니다. / 차를 집 앞으로 몹니다."],
["시간","시간 선에서 어떤 일보다 앞에 있으면 '~전에'입니다. 지금을 기준으로 거슬러 올라간 한 시점도 vor입니다. 시간의 vor는 항상 3격입니다.","vor dem Essen / vor zwei Tagen","식사 전에 / 이틀 전에"],
["동사","눈앞에 마주 선 것이 위험하면 두려움, 경고, 보호의 대상이 됩니다. 이 동사들은 vor + 3격입니다.","Ich habe Angst vor dem Hund. / Der Arzt warnt vor dem Rauchen.","개가 무섭습니다. / 의사가 흡연을 경고합니다."],

hinter:[
["그림","보는 사람(눈)에서 볼 때 상자 뒤에 공이 있어 일부가 가려진 모습입니다. '뒤', '가려짐', '뒤에서 받침'이 hinter의 핵심입니다."],
["공간","뒤에 있으면 3격, 뒤로 가면 4격입니다.","Der Garten liegt hinter dem Haus. / Der Ball rollt hinter das Haus.","정원은 집 뒤에 있습니다. / 공이 집 뒤로 굴러갑니다."],

["시간","앞을 보고 걸어가면 지나온 길은 뒤에 남습니다. 이미 끝낸 일을 hinter sich haben이라고 합니다. 앞으로 할 일은 vor sich haben입니다.","Die Prüfung habe ich hinter mir. / Die Prüfung habe ich noch vor mir.","시험은 이미 끝났습니다. / 시험이 아직 남아 있습니다."],
["숨김","뒤에 가려진 것은 겉으로 보이지 않는 진짜 이유가 됩니다.","Was steckt dahinter?","그 뒤에 무엇이 숨어 있습니까?"]],
neben:[
["그림","상자 바로 옆에 공이 나란히 있는 모습입니다. 둘이 같은 높이에서 붙어 있습니다. '옆', '나란히 하나 더'가 neben의 핵심입니다."],

zwischen:[

["선택","둘 사이에 서 있으면 어느 쪽으로 갈지 정해야 합니다. 고르기와 구별하기 동사가 zwischen을 씁니다.","Ich muss zwischen zwei Angeboten wählen. / Man muss zwischen Ursache und Folge unterscheiden.","두 제안 중에서 골라야 합니다. / 원인과 결과를 구별해야 합니다."],

in:[
["그림","상자 안에 공이 들어 있는 모습입니다. 벽이 사방을 둘러싸고 있어 안과 밖이 나뉩니다. '둘러싸인 안'이 in의 핵심입니다."],

aus:[

["재료","물건이 재료 안에서 만들어져 나온 것으로 봅니다. 관사 없이 씁니다.","Der Tisch ist aus Holz. / eine Tasche aus Leder","테이블은 나무로 만들었습니다. / 가죽 가방"],

von:[
["그림","상자 곁에 있던 공이 떨어져 멀어지는 모습입니다. aus는 안에서 나오고, von은 표면이나 곁에서 떨어져 나옵니다. '출발점'이 von의 핵심입니다."],

["주제","이야기가 어떤 일에서 출발하면 '~에 대해'입니다. über보다 가볍게 이야기하는 느낌입니다.","Er erzählt von seiner Reise.","그는 여행 이야기를 합니다."],

["동사","꿈이 그곳에서 출발하면 träumen von, 결과가 그곳에서 정해지면 abhängen von입니다.","Ich träume von einem Haus am Meer. / Das hängt vom Wetter ab.","바닷가 집을 꿈꿉니다. / 날씨에 달려 있습니다."]],
zu:[
["그림","공이 상자 쪽으로 다가가 닿는 모습입니다. 도착점이 사람이나 정해진 장소라는 것이 zu의 핵심입니다."],

["목적","어디에 가서 하려는 일이 도착점이 되면 목적입니다. zum + 명사화한 동사가 자주 쓰입니다.","Wir treffen uns zum Essen. / Das Wasser ist zum Trinken.","식사하려고 만납니다. / 그 물은 마시는 물입니다."],

["동사","그쪽으로 가서 닿는 동사가 zu + 3격입니다. 초대해서 데려가고, 축하하러 가고, 그 무리에 가서 속하고, 그것에 맞습니다.","Ich lade dich zu meiner Party ein. / Die Jacke passt zu der Hose.","너를 내 파티에 초대합니다. / 재킷이 바지와 어울립니다."]],
nach:[
["그림","멀리 있는 깃발을 향해 방향을 잡고 가는 모습입니다. 닿을 대상보다 '가는 방향'과 '뒤따름'이 nach의 핵심입니다."],

bei:[

entlang:[

function entry(e){

function sys(e){

 if(e.vs.length)h+=`<h4>② 비슷한 전치사와 구분</h4><table><tr><th>비교</th><th>구분 기준</th><th>예문</th></tr>`+e.vs.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td class="de" style="font-weight:500">${esc(r[2])}</td></tr>`).join("")+`</table>`;
 h+=`<h4>③ 격과 형태</h4><ul>`+e.form.map(x=>`<li>${esc(x)}</li>`).join("")+`</ul>`;
 if(e.err.length)h+=`<h4>④ 자주 틀리는 문장</h4>`+e.err.map(r=>`<div class="err"><span class="x">${esc(r[0])}</span><br><span class="o">${esc(r[1])}</span><br><span class="ko">${esc(r[2])}</span></div>`).join("");
 return h+`</div>`;
}

S.why=`<h2>전치사에 관하여</h2>
<p class="lead">전치사는 짧고 자주 쓰는 낱말이라 쉽게 보이지만, 학습자가 가장 오래 틀리는 낱말이기도 합니다. 이 장은 철학자와 언어학자들이 '사이', '장소', '시간', '말의 뜻'에 관해 생각한 것을 빌려, 전치사가 왜 지금과 같은 모습인지 설명합니다. 각 부분 끝에는 그 생각이 전치사를 이해하는 데 어떻게 도움이 되는지 정리했습니다.</p>

<div class="wsec"><h3>1. 혼자서는 뜻을 다 갖지 못하는 낱말</h3>
${IDEA("아리스토텔레스 · 중세 논리학","아리스토텔레스는 『범주론』에서 우리가 무엇에 대해 말할 수 있는 기본 갈래 열 가지를 들었습니다. 그중 '어디'의 예로 든 것이 '뤼케이온 <b>안에서</b>', '시장 <b>에서</b>'이고, '언제'의 예로 든 것이 '어제', '작년'입니다. '어디'를 말하는 대표적인 형태가 처음부터 전치사구였던 셈입니다.<br><br>중세 논리학자들은 낱말을 둘로 나누었습니다. '사람', '달리다'처럼 혼자서도 무엇을 가리키는 낱말과, '모든', '오직', '~을 제외하고(praeter)'처럼 혼자서는 아무것도 가리키지 않고 다른 말과 결합할 때 뜻을 이루는 낱말입니다. 뒤의 것을 공의어(共義語, syncategorema)라고 불렀습니다.")}
<p>전치사도 이런 성격을 지닙니다. auf는 혼자서 아무것도 가리키지 않습니다. auf dem Tisch가 되어야 비로소 '책상 위'라는 자리가 생깁니다. 전치사가 말하는 것은 사물이 아니라 사물과 사물 <b>사이의 관계</b>이고, 관계는 그 관계에 묶인 대상이 있어야 성립합니다. 그래서 전치사는 늘 명사를 데려오고, 그 명사가 어떤 자격으로 관계에 들어오는지를 격으로 표시하게 됩니다.</p>
${LEARN(`<ul><li>전치사를 낱말 하나로 외우지 않고 <b>전치사 + 명사</b>를 한 덩어리로 외웁니다. auf가 아니라 auf dem Tisch, auf den Tisch로 익힙니다.</li><li>전치사의 뜻을 떠올릴 때는 반드시 <b>기준이 되는 대상</b>을 함께 그립니다. an은 '~에'가 아니라 '(벽이라는 기준에) 붙어 있음'입니다.</li></ul>`)}</div>

<div class="wsec"><h3>2. 전치사는 왜 특정한 격을 요구하는가</h3>
${IDEA("역사언어학","독일어의 먼 조상 언어에서는 격 자체가 뜻을 지니고 있었습니다. 명사의 어미만으로 '~로 향해', '~에 있는', '~에서 떠나는', '~로써' 같은 관계를 나타냈습니다. 전치사는 원래 이런 명사 곁에서 뜻을 좁혀 주던 부사였고, 늘 함께 쓰이면서 전치사로 굳었습니다. 이때 함께 쓰이던 격을 그대로 물려받았습니다.<br><br>그 뒤 독일어에서는 '자리를 나타내는 격', '떠나온 곳을 나타내는 격', '도구를 나타내는 격'이 하나로 합쳐져 지금의 3격이 되었습니다. '향해 가는 목표'는 4격이 맡았습니다.")}
<p>그래서 오늘날 전치사와 격의 짝은 대체로 전치사의 그림과 들어맞습니다. 독일어 문법은 이를 "전치사가 격을 다스린다(regieren)"고 말하지만, 역사의 순서로 보면 격이 먼저 있었고 전치사가 그 격과 함께 자라났습니다.</p>
<table><tr><th>격</th><th>명사가 관계에 들어오는 자격</th><th>전치사</th><th>예</th></tr>
<tr><td class="rk"><span class="pill case">4격</span></td><td>향해 가는 목표, 거쳐 가는 대상, 겨누는 상대</td><td class="de">durch, für, gegen, um, ohne</td><td class="de">für dich · durch den Park</td></tr>
<tr><td class="rk"><span class="pill case">3격</span></td><td>머무는 자리, 떠나온 곳, 함께 쓰는 것</td><td class="de">bei, aus, von, mit</td><td class="de">bei dir · aus dem Haus · mit dem Bus</td></tr>
<tr><td class="rk"><span class="pill case">2격</span></td><td>전치사 속에 숨은 명사를 꾸미는 '~의'</td><td class="de">statt, aufgrund, innerhalb</td><td class="de">statt des Busses (= an Statt: 버스의 자리에)</td></tr></table>
<p>2격 전치사는 다른 길로 생겼습니다. statt는 an Statt(그 자리에), aufgrund는 auf Grund(그 바닥 위에), innerhalb는 '안쪽 편'이라는 명사 표현이 한 낱말로 굳은 것입니다. 뒤의 명사는 원래 '~의 자리', '~의 바닥'처럼 그 명사를 꾸미던 말이라 '~의'를 뜻하는 2격으로 남았습니다.</p>
<p>모든 짝이 이렇게 설명되지는 않습니다. zu와 nach는 방향을 말하지만 3격입니다. nach는 nah(가까운)에서 왔고 nah는 지금도 3격과 씁니다(nahe dem Bahnhof). zu에는 zu Hause(집에 있다), zu Weihnachten(크리스마스에)처럼 자리와 때를 나타내는 쓰임이 지금도 남아 있습니다. 뜻은 방향으로 넓어졌지만 격은 옛 모습을 지킨 경우입니다.</p>
${LEARN(`<ul><li>격이 헷갈릴 때는 "이 명사가 관계에 <b>목표</b>로 들어오는가(4격), <b>자리·출발점·도구</b>로 들어오는가(3격)"를 묻습니다. aus, von, bei, mit이 모두 3격인 것이 이 질문 하나로 정리됩니다.</li><li>2격 전치사는 <b>'~의 + 숨은 명사'</b>로 풀어 읽습니다. statt des Busses는 '버스의 자리에', aufgrund des Staus는 '체증의 바탕 위에'입니다. 그러면 뒤에 2격이 오는 것이 자연스럽게 들립니다.</li><li>zu와 nach처럼 그림과 격이 어긋나는 것은 이유를 알고 따로 외웁니다. 어긋나는 것이 몇 개뿐이라는 것을 알면 나머지는 원리로 고를 수 있습니다.</li></ul>`)}</div>

<div class="wsec"><h3>3. 장소에 있음과 장소가 바뀜</h3>
${IDEA("아리스토텔레스 『자연학』","아리스토텔레스는 『자연학』 4권에서 장소(topos)를 다루며, 사물이 어떤 장소에 '있는' 것과 한 장소에서 다른 장소로 '옮겨 가는' 것(이동)을 구별했습니다. 이동은 그가 말한 여러 변화 가운데 장소가 바뀌는 변화입니다.")}
<p>an, auf, hinter, in, neben, über, unter, vor, zwischen 아홉 전치사는 바로 이 구별을 격으로 나타냅니다. 장소에 있으면 3격, 장소가 바뀌어 새 자리에 이르면 4격입니다. 전치사는 같고 관사 한 글자만 바뀌는데, 문장은 정지한 장면과 이동하는 장면으로 갈립니다.</p>
<div class="wpair">
<div class="wcard">${WHY_SVG(false)}<div class="de">Die Katze sitzt auf dem Tisch.</div><div class="ko">고양이가 책상 위에 앉아 있습니다.</div><span class="pill k-시간">3격 · 장소에 있음 · Wo?</span></div>
<div class="wcard">${WHY_SVG(true)}<div class="de">Die Katze springt auf den Tisch.</div><div class="ko">고양이가 책상 위로 뛰어오릅니다.</div><span class="pill k-공간">4격 · 장소가 바뀜 · Wohin?</span></div></div>
<p>여기서 중요한 것은 아리스토텔레스의 구별이 '움직이느냐'가 아니라 '장소가 바뀌느냐'라는 점입니다. 공원 안에서 계속 달려도 공원이라는 장소는 바뀌지 않습니다. 그래서 Wir laufen <b>im</b> Park는 3격이고, 밖에서 공원으로 들어가는 Wir laufen <b>in den</b> Park는 4격입니다.</p>
${LEARN(`<ul><li>3격과 4격을 고를 때 "움직임이 있나?"가 아니라 <b>"문장이 끝났을 때 대상의 자리가 바뀌었나?"</b>를 묻습니다.</li><li>한국어 조사로 확인할 수 있습니다. '~에 있다'로 말이 되면 3격, '~로 (옮겨) 가다/놓다'로 말이 되면 4격입니다: 책상 위<b>에</b> 앉아 있다(auf dem) / 책상 위<b>로</b> 뛰어오르다(auf den).</li><li>stehen(서 있다)과 stellen(세워 놓다), liegen과 legen처럼 있음 동사와 옮겨 놓음 동사가 짝을 이루는 것도 같은 구별입니다.</li></ul>`)}</div>

<div class="wsec"><h3>4. 한 전치사에 여러 뜻이 있는 이유</h3>
${IDEA("아리스토텔레스 · 브루그만과 레이코프 · 비트겐슈타인","아리스토텔레스는 『자연학』 4권에서 '~안에(in)'라는 말이 여러 뜻으로 쓰인다는 것을 하나하나 나열했습니다. 그리고 그 가운데 '그릇 안에, 장소 안에'가 가장 본래의 뜻이라고 했습니다.<br><br>언어학자 브루그만은 영어 전치사 over를 연구해, 한 전치사의 여러 뜻이 하나의 중심 그림에서 조금씩 갈라져 나간 그물을 이룬다고 보았습니다. 레이코프는 『Women, Fire, and Dangerous Things』(1987)에서 이 연구를 소개하며 이런 구조를 '방사형 범주'라고 불렀습니다.<br><br>비트겐슈타인은 『철학적 탐구』에서 '놀이'라는 낱말을 예로 들어, 같은 낱말로 불리는 것들이 모두 하나의 공통점을 가지지 않고 서로 겹치고 엇갈리는 닮음으로 이어져 있다고 했습니다. 그는 이것을 '가족 닮음'이라고 불렀습니다.")}
<p>아리스토텔레스가 나열한 '안에'의 뜻 가운데 몇 가지를 자연스러운 독일어로 옮기면, in이 아닌 다른 전치사가 나옵니다.</p>
<table><tr><th>아리스토텔레스가 든 '안에'</th><th>독일어 표현</th><th>뜻</th></tr>`+AR_IN.map(r=>`<tr><td>${esc(r[0])}</td><td class="de">${esc(r[1])}</td><td class="ko">${esc(r[2])}</td></tr>`).join("")+`</table>
<p>이 표는 두 가지를 보여 줍니다. 첫째, 하나의 전치사 안에 여러 뜻이 있고 그중 공간의 뜻이 가장 기본이라는 생각은 2,300년 전부터 있었습니다. 둘째, 그 여러 뜻을 어느 전치사로 나누어 맡기는지는 언어마다 다릅니다.</p>
<p>브루그만과 레이코프의 설명과 비트겐슈타인의 가족 닮음을 함께 놓으면 전치사의 뜻이 어떻게 이어지는지 정확히 보입니다. an의 뜻은 '붙어 있음'이라는 중심 그림에서 출발해 an der Wand → am Montag(달력의 칸에 붙음) → an einem Projekt arbeiten(일이 대상에 붙음)으로 이어집니다. 이웃한 뜻끼리는 분명히 닮았지만, 맨 끝의 뜻은 중심 그림과 직접 닮은 점이 적을 수 있습니다. 모든 뜻을 하나의 정의로 묶으려 하면 오히려 설명이 억지스러워집니다.</p>
${LEARN(`<ul><li>전치사마다 <b>중심 그림 하나</b>를 먼저 정확히 잡습니다.</li><li>낯선 뜻을 만나면 중심 그림과 바로 연결하려 하지 말고, <b>이웃한 뜻을 거쳐</b> 연결합니다. 카드의 '뜻이 이어지는 방식'을 1번부터 순서대로 따라가면 먼 뜻도 이해됩니다.</li><li>한국어 뜻 하나(an = ~에)로 정의하려는 습관을 버립니다. 그 정의로는 an der Wand와 arbeiten an을 함께 설명할 수 없습니다.</li></ul>`)}</div>

<div class="wsec"><h3>5. 공간으로 시간을 생각합니다</h3>
${IDEA("칸트 · 레이코프와 존슨","칸트는 『순수이성비판』에서 공간과 시간을 우리가 무엇이든 경험할 때 바탕에 깔린 두 형식으로 보았습니다. 그런데 시간은 모양이 없어서, 우리는 시간의 흐름을 <i>eine ins Unendliche fortgehende Linie</i>, 곧 끝없이 뻗어 가는 선으로 그려 생각한다고 했습니다.<br><br>언어학자 조지 레이코프와 철학자 마크 존슨은 『삶으로서의 은유』(1980)에서 은유를 시인이 쓰는 꾸밈말이 아니라 사람이 일상에서 생각하는 기본 방식으로 보았습니다. 시간, 감정, 생각 같은 추상적인 것은 눈에 보이지도 않고 손에 잡히지도 않습니다. 그래서 사람은 몸으로 직접 겪어 아는 공간의 경험, 곧 위와 아래, 앞과 뒤, 안과 밖을 빌려 그것을 이해하고 말한다는 것입니다. 두 사람은 이 주장을 일상 영어 표현을 많이 모아 보여 주었습니다. 기쁜 기분은 위로, 슬픈 기분은 아래로 말하는 것(I'm feeling up / I'm feeling down)이 대표적인 예입니다.<br><br>독일어도 마찬가지입니다. 미래는 우리 앞에 있고(Die Zukunft liegt vor uns), 분위기는 가라앉으며(Die Stimmung sinkt), 사람은 생각 안에 빠져 있습니다(Er ist in Gedanken). 한국어도 '앞날', '기분이 가라앉다'라고 말합니다. 언어가 달라도 추상적인 것을 공간으로 말하는 방식은 크게 다르지 않습니다.")}
<p>독일어 시간 전치사는 칸트가 말한 그 선 위에서 작동합니다. vor, nach, in, seit, ab, bis는 모두 원래 공간의 전치사이고, 시간을 선으로 놓았을 때 그 선 위의 위치와 방향을 말합니다.</p>
<div class="wcard wtl">${TL_SVG}</div>
<table><tr><th>전치사</th><th>공간</th><th>시간</th><th>생각·관계</th></tr>
<tr><td class="rk">vor</td><td class="de">vor dem Haus</td><td class="de">vor dem Essen</td><td class="de">Angst vor dem Hund</td></tr>
<tr><td class="rk">über</td><td class="de">über dem Tisch</td><td class="de">über das Wochenende</td><td class="de">über das Wetter sprechen</td></tr>
<tr><td class="rk">unter</td><td class="de">unter dem Bett</td><td class="de">unter der Woche</td><td class="de">unter Druck</td></tr>
<tr><td class="rk">in</td><td class="de">in der Küche</td><td class="de">im Juli</td><td class="de">in Gefahr</td></tr></table>
${LEARN(`<ul><li>시간 전치사가 헷갈리면 <b>시간선을 그립니다</b>. '지금'에 세로 표시를 하고, 그 왼쪽 한 점이면 vor, 왼쪽에서 지금까지 이어지면 seit, 오른쪽 한 점이면 in, 오른쪽으로 시작해 계속되면 ab입니다.</li><li>추상적인 표현(Angst vor, unter Druck)은 공간 그림으로 되돌려 봅니다. '눈앞에 마주 선 개'가 두려움의 vor이고, '위에서 누르는 무게'가 Druck의 unter입니다.</li></ul>`)}</div>

<div class="wsec"><h3>6. 언어는 무엇에 주의를 기울이게 하는가</h3>
${IDEA("훔볼트 · 슬로빈","훔볼트는 언어가 이미 만들어진 생각을 옮기는 도구가 아니라 생각을 만들어 내는 기관이며, 언어마다 고유한 세계관(Weltansicht)이 들어 있다고 했습니다.<br><br>오늘날 언어학은 언어가 생각을 가둔다는 강한 주장은 받아들이지 않습니다. 대신 언어학자 슬로빈은 '말하기 위한 생각(thinking for speaking)'이라는 말로, 말을 하는 순간 사람은 자기 언어의 문법이 요구하는 구분에 주의를 기울일 수밖에 없다고 설명했습니다.")}
<p>전치사는 이 차이가 가장 잘 드러나는 곳입니다. 한국어로 말할 때는 '에' 하나면 충분한 자리에서, 독일어로 말하려면 붙어 있는지, 얹혀 있는지, 안에 있는지, 누구 곁에 있는지를 반드시 정해야 합니다.</p>
<table><tr><th>한국어</th><th>독일어</th><th>독일어가 묻는 것</th></tr>`+AB_KO.map(r=>`<tr><td>${esc(r[0])}</td><td class="de">${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")+`</table>
<p>반대 방향의 차이도 있습니다. 한국어는 '학교<b>에</b> 있다'와 '학교<b>에서</b> 공부한다'를 나누지만, 독일어는 둘 다 in der Schule입니다. 어느 언어가 더 정확한 것이 아니라 문법이 요구하는 구분이 다를 뿐입니다. 또 독일어는 전치사가 명사 앞에 오고 그 전치사가 격을 정하므로, 명사를 말하기 전에 관계와 격을 먼저 정해야 합니다.</p>
${LEARN(`<ul><li>독일어 전치사가 어려운 이유는 머리가 나빠서가 아니라 <b>한국어가 요구하지 않는 구분을 새로 해야 하기 때문</b>입니다. 어디가 어려운지 알면 연습할 곳이 분명해집니다.</li><li>한국어 '에'로 생각한 문장을 독일어로 옮길 때는 <b>그 '에'에서 멈추고</b> 붙음(an), 얹힘(auf), 안(in), 곁(bei) 중 무엇인지 고릅니다.</li><li>말하기 전에 명사보다 <b>관계를 먼저</b> 정하는 연습을 합니다. 한국어는 '책상 위에'처럼 명사(책상)를 먼저 말하고 관계(위에)를 뒤에 붙입니다. 독일어는 관계(auf)를 먼저 말하고, 그 관계가 정한 격으로 명사를 바꿔 말해야 합니다. 그래서 명사를 꺼내기 전에 아래 세 단계를 머릿속에서 먼저 끝내야 합니다.<ol class="wsub"><li><b>관계 고르기</b>: 책이 책상에 닿아 얹혀 있으므로 auf입니다.</li><li><b>격 정하기</b>: 책이 그 자리에 있고 자리가 바뀌지 않으므로(Wo?) 3격입니다.</li><li><b>관사 바꾸기</b>: der Tisch(남성)의 3격은 dem이므로 auf dem Tisch입니다.</li></ol>같은 책상이라도 '책을 책상 위에 놓는다'면 2단계에서 자리가 바뀌므로(Wohin?) 4격이 되어 der Tisch → den Tisch, Ich lege das Buch auf den Tisch입니다. 처음에는 세 단계를 소리 내어 말하며 연습하고, 익숙해지면 auf dem Tisch, auf den Tisch처럼 결과 덩어리를 바로 떠올리도록 반복합니다. 명사의 성(der, die, das)을 모르면 3단계에서 막히므로 명사는 늘 관사와 함께 외웁니다.</li></ul>`)}</div>

<div class="wsec"><h3>7. 이해할 수 있는 것과 쓰면서 익히는 것</h3>
${IDEA("소쉬르 · 비트겐슈타인","소쉬르는 『일반언어학 강의』에서 낱말을 말소리(기표)와 뜻(기의)이 결합한 기호로 보고, 그 결합이 기본적으로 자의적이라고 했습니다. 필연적인 이유 없이 그 언어를 쓰는 사람들의 약속으로 정해진다는 뜻입니다. 그가 든 예가 독일어와 관련됩니다. '소'라는 같은 뜻을 프랑스어는 bœuf, 독일어는 Ochs라고 부르는데, 어느 쪽 소리도 소와 닮은 데가 없습니다.<br><br>그러면서도 그는 언어 안에 '절대적으로 자의적인 것'과 '상대적으로 동기가 있는 것'이 함께 있다고 구별했습니다. 프랑스어 vingt(20)는 이유 없이 정해진 말이지만, dix-neuf(19)는 dix(10)와 neuf(9)로 이유를 짐작할 수 있습니다. 이 동기는 낱말 하나에서 나오지 않고, 그 낱말이 같은 언어 안의 다른 낱말과 맺는 관계에서 생깁니다. 소쉬르는 언어마다 이 둘의 비율이 다르다고 보았고, 영어가 독일어보다 동기 없는 말에 더 많은 자리를 준다고 비교하기도 했습니다.<br><br>비트겐슈타인은 『철학적 탐구』에서 낱말의 의미를 낱말에 붙어 있는 어떤 대상이나 머릿속 그림으로 보지 않았습니다. 그는 많은 경우 \"Die Bedeutung eines Wortes ist sein Gebrauch in der Sprache.\"(낱말의 의미는 언어 안에서의 쓰임이다)라고 설명할 수 있다고 했습니다. 낱말은 연장통 속의 연장처럼 저마다 하는 일이 다르고, 말은 사람들이 함께 하는 활동, 곧 '언어 놀이(Sprachspiel)' 안에서 뜻을 얻는다는 것입니다. 또 그는 규칙을 따르는 것이 규칙을 머리로 해석하는 일이 아니라 하나의 실천(Praxis)이라고 했습니다. 규칙은 설명을 듣는 것만으로 익혀지지 않고, 그 규칙대로 반복해 행동하면서 몸에 붙는다는 뜻입니다.")}
<p>전치사도 소쉬르의 구별대로 두 부분이 섞여 있습니다. 그림으로 이유를 짐작할 수 있는 짝이 많지만, 오랜 쓰임으로 굳어 이유를 찾기 어려운 짝도 남아 있습니다. auf라는 소리가 왜 '위'를 뜻하는지에는 이유가 없습니다. 이것은 절대적으로 자의적인 부분입니다. 하지만 warten auf, hoffen auf, sich freuen auf가 모두 auf를 쓰는 것은 '앞으로 올 것에 기댐'이라는 같은 그림으로 서로 이어져 있기 때문이고, 이 부분은 상대적으로 동기가 있습니다. 소쉬르의 말대로 동기는 표현 하나가 아니라 표현들 사이의 관계에서 보입니다.</p>
<table><tr><th>이유를 짐작할 수 있는 것</th><th>쓰임으로 굳은 것</th></tr>
<tr><td><span class="de">warten auf</span>: 앞으로 올 것에 기대어 기다림<br><span class="de">Angst vor</span>: 눈앞에 마주 선 위험<br><span class="de">aus Holz</span>: 재료 안에서 나옴</td><td><span class="de">zu Hause / nach Hause</span><br><span class="de">sich interessieren für</span> / <span class="de">interessiert an</span><br><span class="de">unter der Woche</span></td></tr></table>
<p>이유를 짐작할 수 있는 표현은 그 이유와 함께 이해하면 오래 기억할 수 있습니다. 이유를 찾을 수 없는 표현에 근거 없는 이유를 지어내면, 그 잘못된 이유에 따라 다른 표현까지 틀리게 고르게 됩니다. 비트겐슈타인의 말처럼 이런 표현은 실제로 쓰이는 문장과 함께 익혀야 합니다. 그는 규칙을 따르는 것이 실천이라고 했습니다. 그 말대로 이런 표현은 설명을 더 듣는 것보다 직접 여러 번 말하고 써 볼 때 익혀집니다.</p>
${LEARN(`<ul><li>새 표현을 만나면 먼저 <b>그림으로 이유가 보이는지</b> 확인합니다. 보이면 그림으로 이해하고, 보이지 않으면 이유 찾기를 멈춥니다.</li><li>이유가 보이지 않는 표현은 <b>예문 하나와 통째로</b> 외웁니다. Ich interessiere mich für Musik. / Ich bin an Musik interessiert.</li><li>이 자료의 카드에서 '풀어서 정리'의 '자주 틀리는 문장'은 대부분 굳은 표현입니다. 이 부분은 이해보다 반복이 효과적입니다.</li></ul>`)}</div>

<div class="wsec"><h3>8. 정리: 전치사를 배우는 다섯 가지 원칙</h3>
<ol class="wsteps">
<li><b>덩어리로 익힙니다.</b> 전치사는 관계를 말하므로 혼자서는 뜻이 완성되지 않습니다. 전치사 + 명사, 동사 + 전치사로 익힙니다. (1부)</li>
<li><b>역할을 물어 격을 고릅니다.</b> 목표로 들어오면 4격, 자리·출발점·도구로 들어오면 3격, 숨은 명사의 '~의'이면 2격입니다. (2부)</li>
<li><b>자리가 바뀌는지 묻습니다.</b> 3·4격 전치사는 '장소에 있음'과 '장소가 바뀜'으로 고릅니다. (3부)</li>
<li><b>중심 그림에서 이웃한 뜻을 따라갑니다.</b> 공간의 그림 하나에서 시간과 추상의 뜻으로 단계를 밟아 넓힙니다. 시간은 선을 그려 판단합니다. (4·5부)</li>
<li><b>이해할 것과 쓰면서 익힐 것을 나눕니다.</b> 이유가 보이는 것은 그림으로, 굳은 것은 예문으로 익힙니다. 한국어 '에'에서는 늘 멈춥니다. (6·7부)</li></ol></div>`;

const TABS=[["list","전치사 목록"],["pairs","전치사 비교"],["quiz","퀴즈"],["why","전치사에 관하여"]];
const nav=$("#nav"),main=$("#main");
TABS.forEach(([tid,name])=>{
 const b=document.createElement("button");b.textContent=name;b.dataset.id=tid;nav.appendChild(b);
 const s=document.createElement("section");s.id="s-"+tid;s.innerHTML=S[tid];main.appendChild(s);
 b.onclick=()=>{if(tid=="list")closeP(true);show(tid)};
});
function show(tid){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.id==tid));
 document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id=="s-"+tid));
 window.scrollTo(0,0);
}
function bindGo(root){root.querySelectorAll("[data-go]").forEach(a=>a.onclick=()=>openP(a.dataset.go))}

/* ---------- 목록 ---------- */
let mode="group",order=[],listY=0;
const MODES=[["group","의미별"],["case","격별"],["level","단계별"]];
MODES.forEach(([m,name])=>{const c=document.createElement("button");c.className="chip"+(m==mode?" on":"");c.textContent=name;c.dataset.m=m;
 c.onclick=()=>{mode=m;document.querySelectorAll("#modes .chip").forEach(x=>x.classList.toggle("on",x.dataset.m==m));drawList()};$("#modes").appendChild(c)});
const hay=e=>[e.p,e.c,e.lv,e.g,e.core,e.t,JSON.stringify(e.s),JSON.stringify(DETAIL[key(e)]||e.st),JSON.stringify(e.map),JSON.stringify(e.vs),e.form.join(" "),JSON.stringify(e.err)].join(" ").toLowerCase();
function tile(e){return `<button class="tile" data-go="${key(e)}"><span class="n">${esc(e.p)}</span><span class="m"><span class="pill case">${esc(e.c)}</span> <span class="pill lv">${esc(e.lv)}</span></span><span class="c">${esc(e.core)}</span></button>`}
function drawList(){
 const q=$("#q").value.trim().toLowerCase();
 const items=P.filter(e=>!q||hay(e).includes(q));
 const [info,field]=mode=="group"?[GROUP_INFO,"g"]:mode=="case"?[CASE_INFO,"c"]:[LV_INFO,"lv"];
 order=[];let h="";
 info.forEach(([name,desc])=>{const L=items.filter(e=>e[field]==name);if(!L.length)return;order.push(...L);
  h+=`<div class="grp"><div class="gh"><h3>${esc(name)}</h3><span class="ko">${L.length}개 · ${esc(desc)}</span></div><div class="tiles">${L.map(tile).join("")}</div></div>`});
 $("#cnt").textContent=q?`${items.length}개 찾음 · 전체 ${P.length}개`:`전체 ${P.length}개`;
 $("#list").innerHTML=h||`<div class="box center ko">찾는 전치사가 없습니다.</div>`;
 bindGo($("#list"));
}
$("#q").oninput=drawList;
function openP(k){
 const e=BY[k];if(!e)return;
 if($("#detail").style.display=="none")listY=window.scrollY;
 if(!order.some(x=>key(x)==k))order=P.slice();
 const i=order.findIndex(x=>key(x)==k),prev=order[i-1],next=order[i+1];
 $("#detail").innerHTML=`<div class="dbar"><button class="btn" id="dBack">← 목록</button><span class="sp"></span>`+
  (prev?`<button class="btn" data-go="${key(prev)}">← ${esc(prev.p)}</button>`:"")+
  (next?`<button class="btn" data-go="${key(next)}">${esc(next.p)} →</button>`:"")+`</div>`+entry(e);
 show("list");
 $("#listWrap").style.display="none";$("#detail").style.display="";
 bindGo($("#detail"));$("#dBack").onclick=()=>closeP(false);
 window.scrollTo(0,0);
}
function closeP(top){
 $("#detail").style.display="none";$("#listWrap").style.display="";
 window.scrollTo(0,top?0:listY);
}
drawList();
let pcat="전체";
function drawPairs(){
 const L=PAIRS.filter(x=>pcat=="전체"||x.cat==pcat);
 $("#pcnt").textContent=`${L.length}묶음`;
 $("#plist").innerHTML=(pcat=="전체"?PCATS:[pcat]).map(c=>{const G=L.filter(x=>x.cat==c);return G.length?`<h3 class="pcat">${esc(c)}</h3>`+G.map(pairCard).join(""):""}).join("");
 bindGo($("#plist"));
}
["전체"].concat(PCATS).forEach(v=>{const c=document.createElement("button");c.className="chip"+(v==pcat?" on":"");c.textContent=v;
 c.onclick=()=>{pcat=v;document.querySelectorAll("#pcats .chip").forEach(x=>x.classList.toggle("on",x.textContent==v));drawPairs()};$("#pcats").appendChild(c)});
drawPairs();
bindGo($("#s-why"));
show("list");

/* ---------- 퀴즈 ---------- */
let qG="전체",qT="모두",qN="20";
function chips(box,arr,get,set){
 arr.forEach(v=>{const c=document.createElement("button");c.className="chip"+(v==get()?" on":"");c.textContent=v;
  c.onclick=()=>{set(v);box.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.textContent==v));qCount()};box.appendChild(c)});
}
chips($("#qG"),["전체"].concat(GROUP_INFO.map(x=>x[0])),()=>qG,v=>qG=v);
chips($("#qT"),["모두","전치사 고르기","격·관사 고르기"],()=>qT,v=>qT=v);
chips($("#qN"),["10","20","40","전체"],()=>qN,v=>qN=v);
function pool(){return QZ.filter(q=>(qG=="전체"||BY[q[0]].g==qG)&&(qT=="모두"||({"전치사 고르기":"p","격·관사 고르기":"c"})[qT]==q[1]))}
function qCount(){const n=pool().length;$("#qAvail").textContent=`이 조건의 문제 ${n}개 · 전체 ${QZ.length}개`;$("#qGo").disabled=!n}
qCount();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let qs=[],qi=0,score=0,answered=false,wrong=[];
function qStart(list){
 qs=list;qi=0;score=0;wrong=[];
 $("#qSet").style.display="none";$("#qEnd").style.display="none";$("#qPlay").style.display="";qShow();
}
$("#qGo").onclick=()=>{let L=shuffle(pool());if(qN!="전체")L=L.slice(0,+qN);qStart(L)};
$("#qQuit").onclick=qReset;
function qReset(){$("#qSet").style.display="";$("#qPlay").style.display="none";$("#qEnd").style.display="none";qCount();window.scrollTo(0,0)}
function qShow(){
 if(qi>=qs.length)return qFinish();
 const q=qs[qi];answered=false;
 $("#qtype").textContent=q[1]=="p"?"알맞은 전치사를 고르세요":q[1]=="c"?"알맞은 형태를 고르세요":"알맞은 말을 고르세요";
 $("#qtext").textContent=q[2];$("#qinfo").textContent=`${qi+1} / ${qs.length} · 맞힌 문제 ${score}`;$("#qbar").style.width=(qi/qs.length*100)+"%";
 $("#qexp").style.display="none";$("#qNext").style.display="none";$("#qCard").style.display="none";
 const box=$("#qopts");box.innerHTML="";
 shuffle(q[3].map((t,i)=>[t,i])).forEach(([t,i])=>{
  const b=document.createElement("button");b.textContent=t;
  b.onclick=()=>{
   if(answered)return;answered=true;
   const ok=i==0;if(ok)score++;else wrong.push(q);
   b.classList.add(ok?"ok":"no");
   if(!ok)[...box.children].forEach(x=>{if(x.textContent==q[3][0])x.classList.add("ok")});
   const e=$("#qexp");e.style.display="";e.textContent=(ok?"정답입니다. ":"오답입니다. 정답은 "+q[3][0]+"입니다. ")+q[4];
   $("#qinfo").textContent=`${qi+1} / ${qs.length} · 맞힌 문제 ${score}`;
   const c=$("#qCard");c.style.display="";c.textContent=BY[q[0]].p+" 카드 보기";c.onclick=()=>openP(q[0]);
   const n=$("#qNext");n.style.display="";n.textContent=qi+1>=qs.length?"결과 보기":"다음 문제";n.onclick=()=>{qi++;qShow()};
  };
  box.appendChild(b);
 });
}
function qFinish(){
 $("#qPlay").style.display="none";const end=$("#qEnd");end.style.display="";
 let h=`<div class="box center"><div class="q">${qs.length}문제 중 ${score}문제 정답</div><div class="ko">정답률 ${Math.round(score/qs.length*100)}%</div></div>`;
 if(wrong.length){
  h+=`<h3>틀린 문제</h3>`+wrong.map(q=>`<div class="box"><div class="de" style="font-weight:500">${esc(q[2])}</div><div class="o" style="color:var(--dat);font-weight:600;margin-top:4px">정답: ${esc(q[3][0])}</div><div class="ko">${esc(q[4])}</div><div style="margin-top:6px"><span class="plink" data-go="${q[0]}">${esc(BY[q[0]].p)} 카드 보기</span></div></div>`).join("");
 }
 h+=`<div class="row">`+(wrong.length?`<button class="btn pri" id="qRetry">틀린 문제 다시 풀기</button>`:"")+`<button class="btn" id="qBack">설정으로</button></div>`;
 end.innerHTML=h;bindGo(end);
 if(wrong.length)$("#qRetry").onclick=()=>qStart(shuffle(wrong));
 $("#qBack").onclick=qReset;
 window.scrollTo(0,0);
}

</script>
<script>
(function(){
var cover=document.getElementById("cover"),app=document.getElementById("app");
var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function route(){
 var on=location.hash==="#inhalt";
 cover.hidden=on;app.hidden=!on;
 if(on){cover.classList.remove("leave");app.classList.remove("view");void app.offsetWidth;app.classList.add("view");}
 else cover.classList.remove("leave");
 window.scrollTo(0,0);
}
document.getElementById("start").addEventListener("click",function(){
 if(reduce){location.hash="#inhalt";return;}
 cover.classList.add("leave");setTimeout(function(){location.hash="#inhalt";},230);
});
document.getElementById("to-cover").addEventListener("click",function(e){
 e.preventDefault();var ok=false;try{if(location.protocol!=="about:"){history.pushState("",document.title,location.pathname+location.search);ok=true;}}catch(err){}if(!ok){location.hash="";}route();
});
window.addEventListener("hashchange",route);window.addEventListener("popstate",route);
route();
})();
</script>
