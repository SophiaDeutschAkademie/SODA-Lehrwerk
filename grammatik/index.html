.sx-end-b{flex:1;min-width:0}
.sx-end-t{font-size:19px;font-weight:700;color:var(--sx-ink);line-height:1.45;letter-spacing:-.01em;word-break:keep-all}
.sx-end-d{margin-top:4px;font-size:15px;color:var(--sx-mute);line-height:1.6;word-break:keep-all}

.sx-btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 26px;border-radius:12px;border:0;background:var(--sx-navy);color:#fff;font-size:16px;font-weight:650;cursor:pointer;text-decoration:none;transition:background-color .15s ease}

.sx-btn.is-ghost{background:transparent;color:var(--sx-mute);box-shadow:inset 0 0 0 1px #D9D8D2}
.sx-btn.is-ghost:hover{background:#F3F3EF;color:var(--sx-ink)}
.sx-end-nav{display:flex;border-top:1px solid var(--sx-line)}
.sx-end-nav a{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:2px;padding:18px 28px 20px;color:inherit;text-decoration:none;transition:background-color .12s ease}

.sx-end-nav small{font-size:13px;font-weight:600;color:var(--sx-mute)}
.sx-end-nav span{max-width:100%;font-size:15.5px;font-weight:650;color:var(--sx-ink);line-height:1.45;word-break:keep-all}
.sx-end-nav span em{font-style:normal;color:var(--sx-navy);margin-right:7px;font-variant-numeric:tabular-nums}
.sx-end-nav .is-go{background:var(--sx-navy)}

/* ── hosted app: install guide, update notice, loading ──────── */
.sx-install{margin-top:18px;border:0;background:none;padding:8px 12px;font:inherit;font-size:15px;font-weight:600;color:var(--sx-mute);cursor:pointer;border-radius:10px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:#CFCEC8}

.sx-sheet-p{margin:0 0 16px;font-size:15.5px;line-height:1.6;color:var(--sx-ink2);word-break:keep-all;text-align:left}
.sx-sheet-n{margin:6px 0 18px;padding-top:14px;border-top:1px solid var(--sx-line);font-size:14px;line-height:1.6;color:var(--sx-mute);word-break:keep-all;text-align:left}
.sx-share{display:inline-block;width:19px;height:19px;vertical-align:-4px;color:var(--sx-navy)}
.sx-sheet .sx-btn{width:100%;margin-top:6px}
.sx-sheet .sx-sheet-go{margin:0 0 20px}
.sx-update{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 28px;padding:12px 12px 12px 18px;border-radius:14px;background:#ECEEF4;font-size:14.5px;line-height:1.45;color:var(--sx-ink2);word-break:keep-all}

.sx-fail-t{margin-bottom:8px;font-size:19px;font-weight:700;color:var(--sx-ink)}
.sx-fail-d{margin-bottom:22px;font-size:15px;line-height:1.65;color:var(--sx-mute);word-break:keep-all}

96928820"},{"n":"30","ko":"접속법 II","de":"Der Konjunktiv II","title":"Lektion 30 · 접속법 II","src":"lessons/L30.json?v=96b6cf816c"},{"n":"31","ko":"수동태","de":"Das Passiv","title":"Lektion 31 · 수동태","src":"lessons/L31.json?v=199a53fab8"},{"n":"32","ko":"분사","de":"Partizip I und Partizip II","title":"Lektion 32 · 분사","src":"lessons/L32.json?v=32c9dd6b00"},{"n":"33","ko":"접속법 I과 간접화법","de":"Konjunktiv I und indirekte Rede","title":"Lektion 33 · 접속법 I과 간접화법","src":"lessons/L33.json?v=cbf5f68b27"},{"n":"34","ko":"형용사·명사와 전치사","de":"Adjektive und Nomen mit Präpositionen","title":"Lektion 34 · 형용사·명사와 전치사","src":"lessons/L34.json?v=43c12211fa"},{"n":"35","ko":"단어 만들기","de":"Wortbildung","title":"Lektion 35 · 단어 만들기","src":"lessons/L35.json?v=e76544c338"},{"n":"36","ko":"화법조동사의 추측 용법","de":"Modalverben zur Vermutung","title":"Lektion 36 · 화법조동사의 추측 용법","src":"lessons/L36.json?v=e8db682554"},{"n":"37","ko":"고급 연결어와 2격 전치사","de":"Weitere Konnektoren und Präpositionen mit Genitiv","title":"Lektion 37 · 고급 연결어와 2격 전치사","src":"lessons/L37.json?v=8f11bd9420"}]</script>

<script>(function () {
  'use strict';

  function $(id) { return document.getElementById(id); }

  var WEB = true; /* the hosted build switches this on: lessons are fetched, plus install and offline support */

  var META = JSON.parse($('sx-meta').textContent);
  var ASSETS = JSON.parse($('sx-assets').textContent);
  var N = META.length;
  var BY = {};
  META.forEach(function (m, i) { m.i = i; BY[m.n] = m; });

  /* ── saved progress (this browser only) ─────────────────────── */
  var KEY = 'sda-lehrwerk-grammatik-v1';
  function fresh() { return { v: 1, ls: {}, last: null, fs: null }; }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (s && s.v === 1 && s.ls && typeof s.ls === 'object') return s;
    } catch (e) { /* storage unavailable */ }
    return fresh();
  }
  var state = load();
  var saveTimer = 0;
  function save() {
    clearTimeout(saveTimer); saveTimer = 0;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
  }
  function saveSoon() { if (!saveTimer) saveTimer = setTimeout(save, 700); }
  function rec(n) { return state.ls[n] || (state.ls[n] = { p: 0, pos: 0, done: false }); }
  function status(n) {
    var r = state.ls[n];
    if (!r) return 'none';
    if (r.done) return 'done';
    return (r.seen || r.p > 0) ? 'on' : 'none';
  }
  function pct(p) { return Math.round(Math.max(0, Math.min(1, p || 0)) * 100); }
  function counts() {
    var c = { done: 0, on: 0, none: 0 };
    META.forEach(function (m) { c[status(m.n)]++; });
    return c;
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  }
  function glyph(n, cls) {
    var st = status(n), r = state.ls[n];
    var fill = st === 'on' ? Math.max(pct(r.p), 14) : 0;
    return '<i class="sx-glyph' + (st === 'done' ? ' is-done' : st === 'on' ? ' is-on' : '') + (cls ? ' ' + cls : '') +
      '" aria-hidden="true"><b style="height:' + fill + '%"></b></i>';
  }

  /* ── instant scrolling (the lesson CSS turns on smooth scrolling) ─ */
  function jump(y) {
    var de = document.documentElement, prev = de.style.scrollBehavior, top = Math.max(0, y || 0);
    de.style.scrollBehavior = 'auto';
    void getComputedStyle(de).scrollBehavior;
    try { window.scrollTo({ top: top, left: 0, behavior: 'instant' }); }
    catch (e) { window.scrollTo(0, top); }
    de.style.scrollBehavior = prev;
  }
  function scrollable() { return document.documentElement.scrollHeight - window.innerHeight; }
  function ratio() { var h = scrollable(); return h > 0 ? Math.min(Math.max(window.scrollY / h, 0), 1) : 0; }

  /* ── contents ───────────────────────────────────────────────── */
  var sheetsEl = $('sx-sheets'), listEl = $('sx-list');
  (function buildContents() {
    var sh = '', li = '';
    META.forEach(function (m) {
      sh += '<i title="Lektion ' + m.n + ' ' + esc(m.ko) + '"><b></b></i>';
      li += '<li><a class="sx-row" href="#/L' + m.n + '" data-n="' + m.n + '">' +
        '<span class="sx-num">' + m.n + '</span>' +
        '<span class="sx-tt"><span class="sx-ko">' + esc(m.ko) + '</span><span class="sx-de">' + esc(m.de) + '</span></span>' +
        '<span class="sx-st"></span></a></li>';
    });
    sheetsEl.innerHTML = sh;
    listEl.innerHTML = li;
  })();

  function nextTarget() {
    var last = state.last;
    if (!last || !BY[last]) return null;
    if (status(last) !== 'done') return { n: last, label: '이어서 학습' };
    var i = BY[last].i;
    for (var k = 1; k < N; k++) {
      var m = META[(i + k) % N];
      if (status(m.n) !== 'done') return { n: m.n, label: '다음 학습' };
    }
    return null;
  }

  function paintCounts() {
    var c = counts();
    Array.prototype.forEach.call(document.querySelectorAll('[data-count]'), function (el) {
      el.textContent = c.done;
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-line="done"]'), function (el) {
      el.style.transform = 'scaleX(' + (c.done / N) + ')';
    });
    return c;
  }

  function renderContents() {
    var c = paintCounts();
    $('sx-c-done').textContent = c.done;
    $('sx-c-on').textContent = c.on;
    $('sx-c-none').textContent = c.none;
    $('sx-prog').setAttribute('aria-label', '학습 진행: 전체 ' + N + '개 과 가운데 완료 ' + c.done + '개, 학습 중 ' + c.on + '개');

    var ticks = sheetsEl.children;
    META.forEach(function (m, i) {
      var st = status(m.n), r = state.ls[m.n], t = ticks[i];
      t.className = st === 'done' ? 'is-done' : (st === 'on' ? 'is-on' : '');
      t.firstChild.style.height = st === 'on' ? Math.max(pct(r.p), 14) + '%' : '0';
    });

    Array.prototype.forEach.call(listEl.querySelectorAll('.sx-row'), function (a) {
      var n = a.getAttribute('data-n'), st = status(n), r = state.ls[n];
      a.className = 'sx-row' + (st === 'done' ? ' is-done' : st === 'on' ? ' is-on' : '');
      var text = st === 'done' ? '완료' : st === 'on' ? (pct(r.p) >= 1 ? pct(r.p) + '%' : '학습 중') : '';
      a.querySelector('.sx-st').innerHTML = st === 'none' ? '' : '<span class="sx-st-x">' + text + '</span>' + glyph(n);
      a.setAttribute('aria-label', 'Lektion ' + n + ' ' + BY[n].ko + (text ? ', ' + (st === 'on' && pct(r.p) >= 1 ? pct(r.p) + '% 읽음' : text) : ''));
    });

    var res = $('sx-resume'), t = nextTarget();
    if (t) {
      var m = BY[t.n], r = state.ls[t.n];
      res.href = '#/L' + t.n;
      res.innerHTML = glyph(t.n) +
        '<span class="sx-resume-b"><span class="sx-resume-k">' + t.label + '</span>' +
        '<span class="sx-resume-t"><em>' + t.n + '</em><span>' + esc(m.ko) + '</span></span></span>' +
        (status(t.n) === 'on' && r && pct(r.p) >= 1 ? '<span class="sx-resume-p">' + pct(r.p) + '%</span>' : '');
      res.hidden = false;
    } else {
      res.hidden = true;
    }
  }

  $('sx-reset').addEventListener('click', function () {
    if (!window.confirm('모든 과의 학습 기록(완료 표시와 읽던 위치)을 지울까요?')) return;
    var fs = state.fs;
    state = fresh();
    state.fs = fs;
    save();
    renderContents();
  });

  /* ── lesson ─────────────────────────────────────────────────── */
  var main = $('lx-main'), readEl = $('sx-read'), curN = null;

  function setRead(p) { readEl.style.transform = 'scaleX(' + p + ')'; }

  function navLink(m, label, cls) {
    if (!m) return '<a href="#/inhalt" class="' + (cls || '') + '"><small>' + label + '</small><span>목차로 돌아가기</span></a>';
    return '<a href="#/L' + m.n + '" class="' + (cls || '') + '"><small>' + label + '</small><span><em>' + m.n + '</em>' + esc(m.ko) + '</span></a>';
  }

  function paintEnd() {
    var box = main.querySelector('.sx-end');
    if (!box || !curN) return;
    var n = curN, m = BY[n], r = rec(n), done = !!r.done;
    var prev = META[m.i - 1], next = META[m.i + 1];
    var when = '';
    if (done && r.dt) { var d = new Date(r.dt); when = (d.getMonth() + 1) + '월 ' + d.getDate() + '일에 완료했어요.'; }
    box.innerHTML =
      '<div class="sx-end-top">' + glyph(n) +
        '<div class="sx-end-b">' +
          '<div class="sx-end-t">' + (done ? 'Lektion ' + n + ' 학습을 완료했어요' : '이 과를 끝까지 공부했나요?') + '</div>' +
          '<div class="sx-end-d">' + (done ? (when || '목차에 완료로 표시돼 있어요.') : '학습 완료를 누르면 목차의 학습 진행 상황에 반영돼요.') + '</div>' +
          '<div class="sx-end-act">' + (done
            ? '<button type="button" class="sx-btn is-ghost" data-act="undo">완료 취소</button>'
            : '<button type="button" class="sx-btn" data-act="done">학습 완료</button>') + '</div>' +
        '</div>' +
      '</div>' +
      '<nav class="sx-end-nav" aria-label="과 이동">' +
        (prev ? navLink(prev, '이전 과') : '') +
        (next ? navLink(next, '다음 과', done ? 'is-go' : '') : navLink(null, '마지막 과예요', done ? 'is-go' : '')) +
      '</nav>';
  }

  function injectEnd() {
    var box = document.createElement('div');
    box.className = 'sx-end';
    box.setAttribute('data-no-print', '');
    var foot = main.querySelector('.brand-foot');
    if (foot) main.insertBefore(box, foot); else main.appendChild(box);
    paintEnd();
  }

  main.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || !curN) return;
    if (b.getAttribute('data-act') === 'retry') { openLesson(curN); return; }
    var r = rec(curN);
    if (b.getAttribute('data-act') === 'done') { r.done = true; r.dt = Date.now(); r.p = Math.max(r.p, ratio()); }
    else { r.done = false; r.dt = 0; }
    save();
    paintEnd();
    paintCounts();
    var nb = main.querySelector('.sx-end [data-act]');
    if (nb) nb.focus({ preventScroll: true });
  });

  /* images carry width/height, so only web fonts can still move the text; never wait long */
  function whenSettled(fn) {
    var fired = false;
    function go() { if (!fired) { fired = true; requestAnimationFrame(fn); } }
    try {
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(go, go);
      else go();
    } catch (e) { go(); }
    setTimeout(go, 800);
  }

  var toastEl = $('sx-toast'), toastTimer = 0;
  function hideToast() { clearTimeout(toastTimer); toastEl.classList.remove('is-on'); }
  function showToast() {
    toastEl.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 6000);
  }
  $('sx-toast-top').addEventListener('click', function () { hideToast(); jump(0); });

  function lessonHtml(n) {
    if (!WEB) return Promise.resolve(JSON.parse($('lx-' + n).textContent));
    return fetch(BY[n].src).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    });
  }

  var openSeq = 0, mounted = false;
  function openLesson(n) {
    var m = BY[n], r = rec(n), seq = ++openSeq;
    var resumeAt = (!r.done && r.pos > 0.02 && r.pos < 0.98) ? r.pos : 0;
    curN = n; mounted = false;
    r.seen = true; r.t = Date.now(); state.last = n;
    save();

    document.title = m.title;
    $('sx-now-n').textContent = n;
    $('sx-now-t').textContent = m.ko;
    paintCounts();
    hideToast();
    setRead(0);
    main.style.fontSize = state.fs ? state.fs + 'px' : '';
    main.innerHTML = '';
    jump(0);
    var slow = setTimeout(function () {
      if (seq === openSeq && !mounted) main.innerHTML = '<div class="sx-wait">불러오는 중…</div>';
    }, 200);

    lessonHtml(n).then(function (html) {
      if (seq !== openSeq) return;
      clearTimeout(slow);
      Object.keys(ASSETS).forEach(function (k) { html = html.split(k).join(ASSETS[k]); });
      main.innerHTML = html;
      mounted = true;
      injectEnd();
      jump(0);
      if (!resumeAt) return;
      whenSettled(function () {
        if (seq !== openSeq) return;
        var y = resumeAt * scrollable();
        jump(y);
        onScroll();
        showToast();
        setTimeout(function () {
          if (seq !== openSeq || Math.abs(window.scrollY - y) > 2) return;
          var y2 = resumeAt * scrollable();
          if (Math.abs(y2 - y) > 4) { jump(y2); onScroll(); }
        }, 500);
      });
    }, function () {
      if (seq !== openSeq) return;
      clearTimeout(slow);
      main.innerHTML = '<div class="sx-fail"><div class="sx-fail-t">이 과를 열지 못했어요</div>' +
        '<div class="sx-fail-d">인터넷에 연결한 뒤 다시 시도하세요. 한 번 내려받은 과는 인터넷 없이도 열려요.</div>' +
        '<button type="button" class="sx-btn" data-act="retry">다시 시도</button></div>';
    });
  }

  function leaveLesson() {
    if (curN) save();
    openSeq++;
    curN = null; mounted = false;
    hideToast();
    main.innerHTML = '';
    main.style.fontSize = '';
  }

  function onScroll() {
    if (!curN || !mounted) return;
    var p = ratio(), r = rec(curN);
    setRead(p);
    r.pos = p;
    if (p > r.p) r.p = p;
    saveSoon();
  }
  var ticking = false;
  window.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () { ticking = false; onScroll(); });
  }, { passive: true });

  /* quiz — same behaviour as the single lesson files */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('.qo'); if (!b) return;
    var it = b.closest('.qi'); if (!it) return;
    if (it.classList.contains('done')) {
      it.classList.remove('done');
      it.querySelectorAll('.qo').forEach(function (x) { x.className = 'qo'; });
      var ex0 = it.querySelector('.qe'); if (ex0) ex0.style.display = 'none';
      return;
    }
    it.classList.add('done');
    b.classList.add(b.dataset.c === '1' ? 'right' : 'wrong');
    it.querySelectorAll('.qo[data-c="1"]').forEach(function (x) { x.classList.add('right'); });
    it.querySelectorAll('.qo:not(.right):not(.wrong)').forEach(function (x) { x.classList.add('dim'); });
    var ex = it.querySelector('.qe'); if (ex) ex.style.display = 'block';
  });

  /* text size and print */
  function setFs(v) {
    var keep = ratio();
    state.fs = Math.min(24, Math.max(13, v));
    main.style.fontSize = state.fs + 'px';
    save();
    jump(keep * scrollable());
  }
  function currentFs() { return state.fs || Math.round(parseFloat(getComputedStyle(main).fontSize)) || 17; }
  $('fa').addEventListener('click', function () { setFs(currentFs() + 1); });
  $('fb').addEventListener('click', function () { setFs(currentFs() - 1); });
  $('fp').addEventListener('click', function () { window.print(); });

  /* ── routing: #/ (cover) · #/inhalt (contents) · #/L01 … #/L37 ─ */
  var views = { cover: $('cover'), toc: $('toc'), lesson: $('lesson') };
  var cur = null, prevRoute = null, tocY = 0;

  function parse() {
    var h = location.hash || '';
    var m = /^#\/L(\d{2})$/.exec(h);
    if (m && BY[m[1]]) return { v: 'lesson', n: m[1], key: 'L' + m[1] };
    if (h === '#/inhalt') return { v: 'toc', key: 'toc' };
    return { v: 'cover', key: 'cover' };
  }

  function show(v) {
    Object.keys(views).forEach(function (k) {
      var on = k === v;
      views[k].hidden = !on;
      if (on && cur !== null) {
        views[k].classList.remove('sx-enter');
        void views[k].offsetWidth;
        views[k].classList.add('sx-enter');
      }
    });
  }

  function route() {
    var r = parse();
    if (r.key === cur) return;
    if (cur === 'toc') tocY = window.scrollY;
    if (cur && cur.charAt(0) === 'L') leaveLesson();
    show(r.v);
    prevRoute = cur;
    cur = r.key;
    if (r.v === 'toc') {
      document.title = 'Lehrwerk Grammatik';
      renderContents();
      jump(prevRoute && prevRoute.charAt(0) === 'L' ? tocY : 0);
    } else if (r.v === 'lesson') {
      openLesson(r.n);
    } else {
      document.title = 'Lehrwerk Grammatik';
      jump(0);
    }
  }

  function backToContents(e) {
    if (prevRoute === 'toc') { e.preventDefault(); history.back(); }
  }
  $('sx-back').addEventListener('click', backToContents);
  $('sx-mini').addEventListener('click', backToContents);

  /* another tab saved progress: take it over so this tab does not write back an older copy */
  window.addEventListener('storage', function (e) {
    if (e.key !== KEY) return;
    state = load();
    if (cur === 'toc') renderContents();
    else { paintCounts(); paintEnd(); }
  });

  if (WEB) initWeb();

  function initWeb() {
    var ua = navigator.userAgent || '';
    var standalone = navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var android = /Android/i.test(ua);
    var kakao = /KAKAOTALK/i.test(ua);
    var inapp = kakao || /NAVER\(inapp|Instagram|FBAN|FBAV|FB_IAB|Line\/|DaumApps/i.test(ua);
    var deferred = null;
    var installBtn = $('sx-install'), sheet = $('sx-sheet');

    function offerInstall() { installBtn.hidden = standalone || !(deferred || ios || android || inapp); }
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; offerInstall(); });
    window.addEventListener('appinstalled', function () { deferred = null; installBtn.hidden = true; closeSheet(); });
    offerInstall();

    var SHARE = '<svg class="sx-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
    function guide() {
      if (inapp) {
        var url = location.href.split('#')[0];
        return {
          t: '브라우저에서 열어 주세요',
          c: '<p class="sx-sheet-p">카카오톡 같은 앱 안에서 연 화면에서는 홈 화면에 추가할 수 없어요.</p>' +
            (kakao ? '<a class="sx-btn sx-sheet-go" href="kakaotalk://web/openExternal?url=' + encodeURIComponent(url) + '">다른 브라우저로 열기</a>' : '') +
            '<ol><li>화면 위나 아래의 <b>⋮</b> 또는 <b>⋯</b> 메뉴를 누르세요.</li><li><b>다른 브라우저로 열기</b>(아이폰은 <b>Safari로 열기</b>)를 누르세요.</li><li>' +
            (ios ? 'Safari' : 'Chrome') + '에서 다시 <b>홈 화면에 앱 추가</b>를 누르세요.</li></ol>'
        };
      }
      if (ios) {
        return {
          t: '홈 화면에 추가',
          c: '<ol><li>Safari의 공유 버튼 ' + SHARE + '을 누르세요. 버튼이 보이지 않으면 <b>⋯</b> 메뉴 안에 있어요.</li>' +
            '<li><b>홈 화면에 추가</b>를 누르세요.</li><li>홈 화면에 생긴 <b>Grammatik</b> 아이콘으로 여세요.</li></ol>' +
            '<p class="sx-sheet-n">학습 기록은 홈 화면 앱과 Safari에 따로 저장돼요. 아이콘으로 연 앱에서 공부하세요.</p>'
        };
      }
      return {
        t: '홈 화면에 추가',
        c: '<ol><li>브라우저 오른쪽 위나 아래의 메뉴 <b>⋮</b> 또는 <b>≡</b>를 누르세요.</li>' +
          '<li><b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 누르세요.</li><li>홈 화면에 생긴 <b>Grammatik</b> 아이콘으로 여세요.</li></ol>'
      };
    }
    var lastFocus = null;
    function openSheet() {
      var g = guide();
      $('sx-sheet-t').textContent = g.t;
      $('sx-sheet-c').innerHTML = g.c;
      var close = sheet.querySelector('.sx-sheet-box > [data-close]');
      var hasGo = !!sheet.querySelector('.sx-sheet-go');
      close.className = 'sx-btn' + (hasGo ? ' is-ghost' : '');
      close.textContent = hasGo ? '닫기' : '확인';
      lastFocus = document.activeElement;
      sheet.hidden = false;
      sheet.querySelector('.sx-sheet-box').focus();
    }
    function closeSheet() {
      if (sheet.hidden) return;
      sheet.hidden = true;
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }
    sheet.addEventListener('click', function (e) { if (e.target.closest('[data-close]')) closeSheet(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });
    installBtn.addEventListener('click', function () {
      if (deferred && !inapp) {
        var d = deferred;
        deferred = null;
        d.prompt();
        (d.userChoice || Promise.resolve()).then(offerInstall, offerInstall);
        return;
      }
      openSheet();
    });

    if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
    var sw = navigator.serviceWorker, hadController = !!sw.controller, reloading = false;
    sw.addEventListener('controllerchange', function () {
      if (!hadController) { hadController = true; return; }
      if (reloading) return;
      reloading = true;
      save();
      location.reload();
    });
    function offerUpdate(reg) {
      var box = $('sx-update');
      box.hidden = false;
      $('sx-update-go').onclick = function () {
        if (reg.waiting) reg.waiting.postMessage('skip-waiting');
        else location.reload();
      };
    }
    window.addEventListener('load', function () {
      sw.register('sw.js').then(function (reg) {
        function watch(w) {
          if (!w) return;
          w.addEventListener('statechange', function () {
            if (w.state === 'installed' && sw.controller) offerUpdate(reg);
          });
        }
        if (reg.waiting && sw.controller) offerUpdate(reg);
        watch(reg.installing);
        reg.addEventListener('updatefound', function () { watch(reg.installing); });
        var checked = Date.now();
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState !== 'visible' || Date.now() - checked < 30 * 60 * 1000) return;
          checked = Date.now();
          reg.update().catch(function () {});
        });
      }).catch(function () {});
      sw.ready.then(function (reg) {
        var c = navigator.connection;
        if (c && (c.saveData || c.type === 'cellular')) return;
        setTimeout(function () { if (reg.active) reg.active.postMessage('warm'); }, 3000);
      });
    });
  }

  window.addEventListener('hashchange', route);
  window.addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') save(); });

  route();
})();
</script>
</body>
</html>
