<script id="soda-theme-js">
(function(){
  var KEY='soda-theme', d=document.documentElement, t='dark';
  try{var s=localStorage.getItem(KEY); if(s==='light'||s==='dark') t=s;}catch(e){}
  function apply(v){
    d.setAttribute('data-theme',v); d.style.colorScheme=v;
    var m=document.querySelector('meta[name="color-scheme"]'); if(m) m.setAttribute('content',v);
    var c=document.querySelector('meta[name="theme-color"]'); if(c) c.setAttribute('content',v==='dark'?'#14181E':'#FAFAF8');
  }
  apply(t);
  var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  function mount(){
    if(document.getElementById('soda-theme-btn')) return;
    var b=document.createElement('button'); b.type='button'; b.id='soda-theme-btn'; b.className='soda-theme-btn';
    function paint(){ var dk=d.getAttribute('data-theme')==='dark'; b.innerHTML=dk?SUN:MOON; b.setAttribute('aria-pressed',dk?'true':'false'); b.setAttribute('aria-label','다크 모드 '+(dk?'끄기':'켜기')); b.title='다크 모드 '+(dk?'켜짐':'꺼짐')+' · 누르면 '+(dk?'라이트':'다크')+'로 바뀌어요'; }
    b.addEventListener('click',function(){ var n=d.getAttribute('data-theme')==='dark'?'light':'dark'; apply(n); try{localStorage.setItem(KEY,n);}catch(e){} paint(); });
    paint(); document.body.appendChild(b);
    if(!document.getElementById('soda-toc-btn')){ var a=document.createElement('a'); a.id='soda-toc-btn'; a.className='soda-toc-btn'; a.href='../#inhalt'; a.setAttribute('aria-label','목차로 돌아가기'); a.innerHTML='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l-6 6 6 6"/></svg>목차'; document.body.appendChild(a); }
  }
  if(document.body) mount(); else document.addEventListener('DOMContentLoaded',mount);
})();
</script>

<style id="a2hs-css">
.a2hs-btn{display:block;width:-webkit-max-content;width:max-content;align-self:flex-start;margin:14px 0 0;padding:6px 2px;border:0;background:none;font:inherit;font-size:14px;font-weight:600;line-height:1.4;color:#6B6B66;cursor:pointer;border-radius:8px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:#CFCEC8;-webkit-tap-highlight-color:transparent}

.a2hs-btn[hidden]{display:none}
.a2hs-sheet{position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147483000;display:flex;align-items:flex-end;justify-content:center;font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}

.a2hs-bg{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(20,22,30,.4)}
.a2hs-box{position:relative;width:calc(100% - 24px);max-width:440px;margin:0 0 calc(12px + env(safe-area-inset-bottom));padding:26px 24px 20px;background:#fff;border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.2);text-align:left;outline:none;color:#3A3A37}

.a2hs-c li::before{counter-increment:a2;content:counter(a2);position:absolute;left:0;top:1px;display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#384568;color:#fff;font-size:13px;font-weight:700;line-height:1}

<script id="a2hs-js">
(function(){
  if (location.protocol === 'file:') return;
  var ua = navigator.userAgent || '';
  var standalone = navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  var kakao = /KAKAOTALK/i.test(ua);
  var inapp = kakao || /NAVER\(inapp|Instagram|FBAN|FBAV|FB_IAB|Line\/|DaumApps/i.test(ua);
  var deferred = null, sheet = null, lastFocus = null;
  function can(){ return !standalone && !!(deferred || ios || android || inapp); }
  function name(){ var m = document.querySelector('meta[name="apple-mobile-web-app-title"]'); return (m && m.content) || document.title; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
  function guide(){
    var n = esc(name());
    if (inapp) {
      var url = location.href.split('#')[0];
      return { t: '브라우저에서 열어 주세요',
        c: '<p>카카오톡 같은 앱 안에서 연 화면에서는 홈 화면에 추가할 수 없어요.</p>' +
          (kakao ? '<a class="a2hs-go" href="kakaotalk://web/openExternal?url=' + encodeURIComponent(url) + '">다른 브라우저로 열기</a>' : '') +
          '<ol><li>화면 위나 아래의 <b>⋮</b> 또는 <b>⋯</b> 메뉴를 누르세요.</li><li><b>다른 브라우저로 열기</b>(아이폰은 <b>Safari로 열기</b>)를 누르세요.</li><li>' +
          (ios ? 'Safari' : 'Chrome') + '에서 다시 <b>홈 화면에 앱 추가</b>를 누르세요.</li></ol>', go: true };
    }
    if (ios) {
      return { t: '홈 화면에 추가',
        c: '<ol><li>Safari의 공유 버튼 ' + SHARE + '을 누르세요. 버튼이 보이지 않으면 <b>⋯</b> 메뉴 안에 있어요.</li>' +
          '<li><b>홈 화면에 추가</b>를 누르세요.</li><li>홈 화면에 생긴 <b>' + n + '</b> 아이콘으로 여세요.</li></ol>' +
          '<p class="n">학습 기록은 홈 화면 앱과 Safari에 따로 저장돼요. 아이콘으로 연 앱에서 공부하세요.</p>' };
    }
    return { t: '홈 화면에 추가',
      c: '<ol><li>브라우저 오른쪽 위나 아래의 메뉴 <b>⋮</b> 또는 <b>≡</b>를 누르세요.</li>' +
        '<li><b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 누르세요.</li><li>홈 화면에 생긴 <b>' + n + '</b> 아이콘으로 여세요.</li></ol>' };
  }
  function build(){
    if (sheet) return;
    sheet = document.createElement('div');
    sheet.className = 'a2hs-sheet'; sheet.hidden = true;
    sheet.setAttribute('role', 'dialog'); sheet.setAttribute('aria-modal', 'true'); sheet.setAttribute('aria-labelledby', 'a2hs-t');
    sheet.innerHTML = '<div class="a2hs-bg" data-close></div><div class="a2hs-box" tabindex="-1"><h2 class="a2hs-t" id="a2hs-t"></h2><div class="a2hs-c"></div><button type="button" class="a2hs-ok" data-close>확인</button></div>';
    sheet.addEventListener('click', function(e){ if (e.target.closest('[data-close]')) close(); });
    document.body.appendChild(sheet);
  }
  function open(){
    build();
    var g = guide();
    sheet.querySelector('.a2hs-t').textContent = g.t;
    sheet.querySelector('.a2hs-c').innerHTML = g.c;
    var ok = sheet.querySelector('.a2hs-ok');
    ok.className = 'a2hs-ok' + (g.go ? ' is-ghost' : '');
    ok.textContent = g.go ? '닫기' : '확인';
    lastFocus = document.activeElement;
    sheet.hidden = false;
    sheet.querySelector('.a2hs-box').focus();
  }
  function close(){
    if (!sheet || sheet.hidden) return;
    sheet.hidden = true;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function onClick(){
    if (deferred && !inapp) {
      var d = deferred; deferred = null;
      d.prompt();
      (d.userChoice || Promise.resolve()).then(refresh, refresh);
      return;
    }
    open();
  }
  function refresh(){
    var list = document.querySelectorAll('.a2hs-btn');
    for (var i = 0; i < list.length; i++) list[i].hidden = !can();
  }
  /* 표지가 그려질 때마다(독해 훈련처럼 나중에 그려지는 표지 포함) 시작 버튼 아래에 붙인다 */
  function mount(){
    var heroes = document.querySelectorAll('.hero, .uc-hero');
    for (var i = 0; i < heroes.length; i++) {
      var h = heroes[i];
      if (h.querySelector('.a2hs-btn')) continue;
      var cta = h.querySelector('.cta, .uc-cta');
      if (!cta) continue;
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'a2hs-btn'; b.textContent = '홈 화면에 앱 추가'; b.hidden = !can();
      b.addEventListener('click', onClick);
      cta.parentNode.insertBefore(b, cta.nextSibling);
    }
  }
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred = e; refresh(); });
  window.addEventListener('appinstalled', function(){ deferred = null; standalone = true; refresh(); close(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
  function start(){
    mount();
    if (window.MutationObserver) new MutationObserver(mount).observe(document.body, { childList: true, subtree: true });
  }
  if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
})();
</script>
