<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!--SODA_THEME_JS-->
<!--SODA_FZ-->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__SEITE__</title>
<meta name="theme-color" content="#14181E">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="__MARK__">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/pretendard.css">
<style>
/* Schrift: DM Sans (gekürzt auf Latein, Strichstärke 400–900), Copyright 2014 The DM Sans Project Authors, SIL Open Font License 1.1 (../erwachsene/fonts/OFL.txt) */
@font-face{font-family:"DM Sans";font-weight:400 900;font-style:normal;font-display:swap;src:url(../erwachsene/fonts/DMSans-latin.woff) format("woff")}
:root{
  --bg:#FBF8F1;--surface:#FFFFFF;--ink:#2E3A55;--ink2:#5E687F;--line:#E9DFCB;--sand:#DECDB0;--soft:#F4ECDD;
  --accent:__ACC__;--accent-ink:__INK__;--fill:__FILL__;--on-fill:#FFFFFF;--on-ink:#FBF8F1;
  --de:"DM Sans","Pretendard Variable","Pretendard",system-ui,sans-serif;
  --ko:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif;
}
html[data-theme="dark"]{
  --bg:#182033;--surface:#232D46;--ink:#F4EFE3;--ink2:#AAB3C7;--line:#36415E;--sand:#4D5979;--soft:#2B3654;
  --accent:__DACC__;--accent-ink:__DINK__;--fill:__DFILL__;--on-fill:#182033;--on-ink:#182033;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--ko);font-size:calc(16px*var(--fz));line-height:1.6;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere}
h1,h2,h3,h4,p,ol,ul,dl,dd,figure{margin:0}
ol,ul{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
a{color:inherit}
.de{font-family:var(--de)}
.nb{display:inline-block;max-width:100%;vertical-align:baseline}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}

/* 표지와 단계 계단 */
.top{display:grid;gap:34px;padding:76px 0 34px}
.hero{display:flex;flex-direction:column;align-items:flex-start}
.mark{font-family:var(--de);font-weight:800;font-size:calc(16px*var(--fz));line-height:1.2;letter-spacing:.01em;color:var(--accent-ink)}
h1{margin-top:10px;font-weight:800;font-size:clamp(34px,8.6vw,58px)/*고정*/;line-height:1.14;letter-spacing:-.035em}
.sub{margin-top:10px;font-family:var(--de);font-weight:600;font-size:calc(17px*var(--fz));line-height:1.3;color:var(--ink2)}
.lead{margin-top:18px;max-width:33em;font-size:calc(16px*var(--fz))}
.cta{margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:24px;background:var(--ink);color:var(--on-ink);font-weight:700;font-size:calc(16px*var(--fz));line-height:1.2;text-decoration:none}
.btn:active{transform:translateY(1px)}
.hero .a2hs-btn{margin-top:10px}
html[data-theme="dark"] .hero .a2hs-btn{color:var(--ink2)}
.note{margin-top:16px;padding-left:12px;border-left:3px solid var(--accent);font-size:calc(14px*var(--fz));line-height:1.55;color:var(--ink2)}

.stufen h2{font-weight:800;font-size:calc(20px*var(--fz));line-height:1.3;letter-spacing:-.02em}
.stufen .hint{margin-top:2px;font-size:calc(14px*var(--fz));color:var(--ink2)}
.stairs,.groups{max-width:calc(var(--n)*76px + (var(--n) - 1)*4px)}      /* 단계가 적은 교재에서 계단 한 칸이 너무 넓어지지 않게 */
.stairs{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;align-items:end;height:150px;margin-top:16px}
.step{height:var(--h);min-width:0;padding:8px 0 0;border:1.5px solid var(--line);border-radius:10px 10px 4px 4px;background:var(--soft);color:var(--ink);font-family:var(--de);font-weight:800;font-size:11.5px/*고정*/;line-height:1.15;letter-spacing:-.02em;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;transform-origin:50% 100%;transition:background-color .15s,border-color .15s,color .15s}
.step span{display:block}
.step:hover{border-color:var(--accent)}
.step[aria-selected="true"]{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}
.groups{display:grid;gap:4px;margin-top:8px}
.groups div{padding-top:7px;border-top:2px solid var(--sand);font-size:12px/*고정*/;line-height:1.35;color:var(--ink2)}
.groups b{display:block;font-family:var(--de);font-weight:800;font-size:14px/*고정*/;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){
  .js .step{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*55ms)}
  @keyframes rise{from{transform:scaleY(.55);opacity:0}to{transform:none;opacity:1}}
}

/* 단계별 목차 */
.panel{display:grid;gap:22px;padding:30px 0 38px;border-top:1.5px solid var(--line)}
.js .panel[hidden]{display:none}
.p-code{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--fill);color:var(--on-fill);font-family:var(--de);font-weight:800;font-size:calc(14px*var(--fz));line-height:1.4}
.p-art{margin-left:8px;font-weight:700;font-size:calc(13px*var(--fz));line-height:1.4;color:var(--ink2)}
.p-name{margin-top:10px;font-family:var(--de);font-weight:900;font-size:clamp(32px,8.6vw,46px)/*고정*/;line-height:1.08;letter-spacing:-.035em;overflow-wrap:normal}
.p-ko{margin-top:6px;font-weight:700;font-size:calc(17px*var(--fz));color:var(--ink2)}
.p-lead{margin-top:14px;font-size:calc(15.5px*var(--fz))}
.p-info h3{margin-top:20px;font-weight:700;font-size:calc(13px*var(--fz));line-height:1.3;color:var(--ink2)}
.kann{margin-top:6px}
.kann li{position:relative;padding-left:16px;font-size:calc(15px*var(--fz));line-height:1.55}
.kann li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.p-info dl{margin-top:16px;display:grid;gap:10px}
.p-info dt{font-weight:700;font-size:calc(13px*var(--fz));line-height:1.3;color:var(--ink2)}
.p-info dd{margin-top:2px;font-size:calc(14.5px*var(--fz));line-height:1.55}
.p-info dd.lnk{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.p-info dd.lnk a{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border:1.5px solid var(--line);border-radius:999px;font-weight:600;font-size:calc(13.5px*var(--fz));line-height:1.2;text-decoration:none}
.p-info dd.lnk a:hover{border-color:var(--accent)}

.leks{border-top:1px solid var(--line)}
.lek{display:grid;grid-template-columns:30px minmax(0,1fr);gap:0 10px;padding:13px 0 14px;border-bottom:1px solid var(--line)}
.num{width:28px;height:28px;margin-top:1px;border:1.5px solid var(--sand);border-radius:50%;display:grid;place-items:center;font-family:var(--de);font-weight:800;font-size:13.5px/*고정*/;line-height:1}
.lek h3{display:flex;flex-wrap:wrap;align-items:baseline;gap:1px 10px;line-height:1.3}
.lek h3 .de{font-weight:700;font-size:calc(18px*var(--fz));letter-spacing:-.015em}
.lek h3 .ko{font-weight:600;font-size:calc(13.5px*var(--fz));color:var(--ink2)}
.lek dl{margin-top:6px;display:grid;gap:3px}
.lek dl div{display:grid;grid-template-columns:calc(42px*var(--fz)) minmax(0,1fr);gap:0 6px;align-items:baseline}
.lek dt{font-weight:700;font-size:calc(12px*var(--fz));line-height:1.5;color:var(--ink2)}
.lek dd{font-size:calc(14px*var(--fz));line-height:1.5}
.lek dd.gr{font-family:var(--de);font-weight:500;color:var(--ink)}
.lek dd .zw{display:block}
.lek dd .zw i{display:inline-block;margin-right:6px;font-style:normal;font-weight:700;font-size:calc(12px*var(--fz));color:var(--accent-ink)}
.syn{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:5px;font-family:var(--ko);font-weight:600;font-size:calc(12px*var(--fz));line-height:1.2;color:var(--ink2)}
.syn a{display:inline-grid;place-items:center;min-width:30px;height:26px;padding:0 7px;border:1px solid var(--line);border-radius:999px;font-family:var(--de);font-weight:700;font-size:12px/*고정*/;line-height:1;color:var(--ink);text-decoration:none}
.syn a:hover{border-color:var(--accent)}
.sta,.tst{margin:10px 0;padding:11px 14px 12px;border-radius:12px}
.sta{background:var(--soft)}
.tst{border:1.5px solid var(--accent)}
.sta b,.tst b{font-family:var(--de);font-weight:800;font-size:calc(15px*var(--fz));line-height:1.3;letter-spacing:-.01em}
.sta i,.tst i{margin-left:8px;font-style:normal;font-weight:600;font-size:calc(12.5px*var(--fz));color:var(--ink2)}
.sta p,.tst p{margin-top:2px;font-size:calc(14px*var(--fz));line-height:1.5}
.sta p span{font-weight:700}

/* 본문이 올라온 줄: 줄 전체를 누르면 그 과로 간다 */
.auf{position:relative}
.auf a.go{text-decoration:none}
.auf a.go::after{content:"";position:absolute;inset:0}
.auf:hover a.go,.auf a.go:focus-visible{text-decoration:underline;text-underline-offset:3px}
.auf .syn a{position:relative;z-index:1}
.lek.auf>div{padding-right:20px}
.lek.auf::after,.sta.auf::after,.tst.auf::after{content:"";position:absolute;right:4px;top:22px;width:8px;height:8px;border-right:2px solid var(--ink2);border-top:2px solid var(--ink2);transform:rotate(45deg);pointer-events:none}
.sta.auf,.tst.auf{padding-right:34px}
.sta.auf::after,.tst.auf::after{right:16px;top:50%;margin-top:-5px}
.stat{font-weight:700;font-size:calc(12px*var(--fz));line-height:1.3;color:var(--accent-ink)}
.sta .stat,.tst .stat{margin-left:8px}
.lek.fin .num{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}
.step.offen{position:relative}
.step.offen::after{content:"";position:absolute;left:50%;bottom:9px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--accent)}
.step.offen[aria-selected="true"]::after{background:var(--on-fill)}
.p-go{margin-top:16px}
.p-go .btn{min-height:44px;padding:0 22px;font-size:calc(15px*var(--fz))}
.p-wart,.p-na{margin-top:14px;font-size:calc(13.5px*var(--fz));color:var(--ink2)}
.p-go+.p-na,.p-go+.p-wart{margin-top:10px}

/* 과 구성 */
.more{display:grid;gap:34px;padding:34px 0 10px;border-top:1.5px solid var(--line)}
.more h2{font-weight:800;font-size:calc(20px*var(--fz));line-height:1.3;letter-spacing:-.02em}
.more .hint{margin-top:2px;font-size:calc(14px*var(--fz));color:var(--ink2)}
.teile{margin-top:14px;display:grid;gap:0;counter-reset:t}
.teile li{counter-increment:t;display:grid;grid-template-columns:30px minmax(0,1fr);gap:0 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.teile li::before{content:counter(t);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-family:var(--de);font-weight:800;font-size:13.5px/*고정*/;line-height:1}
.teile b,.dazu b{display:block;font-family:var(--de);font-weight:700;font-size:calc(16.5px*var(--fz));line-height:1.3;letter-spacing:-.01em}
.teile span,.dazu span{display:block;font-size:calc(14px*var(--fz));line-height:1.5;color:var(--ink2)}
.dazu{margin-top:14px;display:grid;gap:12px}
.dazu li{padding-left:12px;border-left:3px solid var(--sand)}
.more h2.zwei{margin-top:30px}
.weiter{margin-top:8px;font-size:calc(15px*var(--fz));line-height:1.6}
.weiter a{font-weight:700;text-underline-offset:3px}
.weiter.wl{display:flex;flex-wrap:wrap;gap:6px 18px}
footer{padding:26px 0 44px;font-size:calc(13px*var(--fz));line-height:1.5;color:var(--ink2)}
footer a{text-underline-offset:3px}

@media (min-width:560px){
  .stairs,.groups{max-width:calc(var(--n)*120px + (var(--n) - 1)*8px)}
  .stairs{height:168px;gap:8px}
  .groups{gap:8px}
  .step{font-size:14px/*고정*/;padding-top:10px;flex-direction:row;justify-content:center;align-items:flex-start;border-radius:12px 12px 5px 5px}
  .groups div{font-size:13px/*고정*/}
}
@media (min-width:900px){
  .wrap{padding:0 32px}
  .top{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:56px;align-items:end;padding:96px 0 46px}
  .stairs{height:208px}
  .step{font-size:13px/*고정*/}
  .panel{grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:52px;padding:40px 0 48px}
  .p-name{font-size:46px/*고정*/}
  .p-info{position:sticky;top:20px;align-self:start}
  .more{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;padding:44px 0 14px}
  .lek{grid-template-columns:34px minmax(0,1fr)}
}
@media print{
  .cta,.note,.hint{display:none}
  .js .panel[hidden]{display:grid}
}
/*SODA_DARK_SHARED*/
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <header class="hero">
      <p class="mark" lang="de">__MARK__</p>
      <h1>__TITEL__</h1>
      <p class="sub" lang="de">__SUB__</p>
      <p class="lead">__LEAD__</p>
      <p class="cta"><a class="btn" href="#inhalt">목차 보기</a></p>
      <p class="note"><!--NOTE--></p>
    </header>
    <section class="stufen" aria-labelledby="stufen-h" style="--n:__N__">
      <h2 id="stufen-h">__STUFEN__</h2>
      <p class="hint">단계를 누르면 그 단계의 목차가 열려요.</p>
      <div class="stairs" role="tablist" aria-label="단계 고르기">
<!--STAIRS-->
      </div>
      <div class="groups" style="grid-template-columns:repeat(__NG__,minmax(0,1fr))">
<!--GROUPS-->
      </div>
    </section>
  </div>

  <div id="inhalt">
<!--PANELS-->
  </div>

  <div class="more">
    <section aria-labelledby="aufbau-h">
      <h2 id="aufbau-h">한 과는 이렇게 진행돼요</h2>
      <p class="hint">모든 과가 같은 여섯 순서로 이어져요.</p>
      <ol class="teile">
<!--AUFBAU-->
      </ol>
    </section>
    <section aria-labelledby="dazu-h">
      <h2 id="dazu-h">과마다 함께 들어 있어요</h2>
      <ul class="dazu">
<!--EXTRAS-->
      </ul>
      <h2 class="zwei">한 단계는 이렇게 이루어져요</h2>
      <p class="weiter">__STUFE__</p>
      <h2 class="zwei">__WEITER_T__</h2>
      <p class="weiter">__WEITER__</p>
      <p class="weiter wl"><!--WEITER_LINKS--></p>
    </section>
  </div>

  <footer>
    <p><span class="de">__MARK__</span>, __TITEL__. __DATE__ 업데이트. <a href="../#inhalt">SODA Lehrwerk 목차로</a></p>
  </footer>
</main>
<!--A2HS-->
<script>
(function(){
  var d=document,ids=__IDS__,cur=0;
  d.documentElement.classList.add('js');
  var tabs=[].slice.call(d.querySelectorAll('.step')),panels=ids.map(function(id){return d.getElementById('p-'+id)});
  function show(i,focus,push){
    cur=i;
    tabs.forEach(function(t,k){var on=k===i;t.setAttribute('aria-selected',on?'true':'false');t.tabIndex=on?0:-1;panels[k].hidden=!on});
    if(focus)tabs[i].focus();
    if(push){try{history.replaceState(null,'','#'+ids[i])}catch(e){}}
  }
  tabs.forEach(function(t,k){
    t.addEventListener('click',function(){show(k,false,true)});
    t.addEventListener('keydown',function(e){
      var n=e.key==='ArrowRight'?k+1:e.key==='ArrowLeft'?k-1:e.key==='Home'?0:e.key==='End'?ids.length-1:-1;
      if(n<0||n>=ids.length)return;
      e.preventDefault();show(n,true,true);
    });
  });
  function fromHash(){var i=ids.indexOf((location.hash||'').slice(1));show(i>=0?i:cur,false,false);return i}
  window.addEventListener('hashchange',fromHash);
  /* 과 화면의 「교재 목차」처럼 단계 주소(#a1-2)로 들어오면 그 단계의 목차가 바로 보이는 자리로 간다. 새로 고침과 뒤로 가기는 브라우저가 자리를 되돌리므로 건드리지 않는다 */
  if(fromHash()>=0){
    var nav=(window.performance&&performance.getEntriesByType&&performance.getEntriesByType('navigation')[0])||{},at=-1;
    var zu=function(){
      var el=d.getElementById('inhalt');if(!el)return;
      if(at>=0&&Math.abs((window.pageYOffset||0)-at)>4)return;          /* 그사이 손으로 움직였으면 그대로 둔다 */
      var y=Math.max(0,Math.round(el.getBoundingClientRect().top+(window.pageYOffset||0)));
      try{window.scrollTo({top:y,left:0,behavior:'instant'})}catch(e){window.scrollTo(0,y)}
      at=window.pageYOffset||0;
    };
    if(!nav.type||nav.type==='navigate'){zu();window.addEventListener('load',zu)}
  }
  /* 공부한 기록(과 화면이 이 브라우저에 남긴 것)으로 마친 과와 보던 과를 표시한다. 기록은 교재마다 따로 있다.
     공통 과정은 예전에 두 교재에 따로 있었다. 새 기록이 아직 없으면 그때의 기록(alt)에서 과마다 더 나중 것을 읽는다 (옮겨 적는 일은 과 화면이 한다) */
  function lies(){
    var o=null,alt=__ALT__,L={};
    try{o=JSON.parse(localStorage.getItem('__STORE__')||'null')}catch(e){}
    if(o&&o.l)return o.l;
    alt.forEach(function(k){
      try{var a=(JSON.parse(localStorage.getItem(k)||'{}').l)||{};
        Object.keys(a).forEach(function(id){if(!/^(a1|a2|b1)-/.test(id))return;if(!L[id]||(a[id].t||0)>(L[id].t||0))L[id]=a[id]})}catch(e){}
    });
    return L;
  }
  function mark(){
    var L=lies();
    [].forEach.call(d.querySelectorAll('.auf[data-id]'),function(li){
      var r=L[li.getAttribute('data-id')],s=li.querySelector('.stat');if(!s)return;
      li.classList.toggle('fin',!!(r&&r.fin));s.textContent=r&&r.fin?'마침':(r&&r.d?'보는 중':'');
    });
    [].forEach.call(d.querySelectorAll('[data-go]'),function(a){
      var items=[].slice.call(d.querySelectorAll('#p-'+a.getAttribute('data-go')+' .auf')),now=null,lastFin=-1;
      items.forEach(function(li,k){var r=L[li.getAttribute('data-id')];if(!r)return;if(r.fin)lastFin=k;else if(r.t&&(!now||r.t>now.t))now={t:r.t,k:k}});
      var k=now?now.k:(lastFin>=0?(lastFin<items.length-1?lastFin+1:0):-1);if(k<0)return;
      var link=items[k].querySelector('a.go');a.href=link.getAttribute('href');
      a.textContent=lastFin===items.length-1&&!now?'처음부터 다시 보기':link.textContent+(now?' 이어서 하기':' 시작하기');
    });
  }
  mark();window.addEventListener('pageshow',mark);
})();
</script>
<script id="soda-analytics" data-goatcounter="https://sodadeutsch.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
